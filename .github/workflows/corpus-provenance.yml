#
# Vendored-corpus provenance: proves each vendored offline corpus is still what
# its upstream source publishes.
#
# Two corpora, same contract:
#
#   * wycheproof_vectors/ — byte-for-byte C2SP/wycheproof at the pinned commit.
#   * tests/kat/keyformats/ — the records extracted from RFC 9881, RFC 8410 and
#     draft-ietf-lamps-kyber-certificates at the revisions each file records.
#
# The per-PR CI already runs both OFFLINE halves — via
# tests/test_wycheproof_corpus_provenance.py and
# tests/test_keyformat_corpus_provenance.py, plus the CLI in ci.yml's
# code-quality job. This workflow adds the ONLINE halves, which need network and
# so run on a monthly schedule (drift watch) and whenever a PR actually touches
# a corpus or its tooling (validating a refresh against upstream).
name: Vendored Corpus Provenance

on:
  schedule:
    # 1st of each month, 06:00 UTC — upstream drift / silent-modification watch.
    - cron: '0 6 1 * *'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every pull request runs this workflow, and this job decides whether the
  # change touches anything the jobs below verify.  It replaced a path-filtered
  # workflow plus a no-op twin that reported the same context: the two were not
  # exclusive (paths: fires when ANY changed file matches, paths-ignore: when ANY
  # is not ignored), so a mixed pull request ran both and the twin's green
  # arrived first.  tools/pr_touches_watched_paths.py has the full account.  A
  # failed detection is a failure, never "not relevant".
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.match.outputs.relevant }}
    steps:
      - name: Checkout (the merge commit and its base parent)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Does this change touch a watched path?
        id: match
        env:
          EVENT: ${{ github.event_name }}
          WATCHED_PATHS: |
            wycheproof_vectors/**
            tools/refresh_wycheproof_corpus.py
            tests/kat/keyformats/**
            tools/build_keyformat_corpus.py
            tools/check_vector_provenance.py
            tests/kat/**
            .github/workflows/corpus-provenance.yml
            tools/pr_touches_watched_paths.py
        run: python3 tools/pr_touches_watched_paths.py --event "$EVENT"

  provenance:
    name: Verify corpus against upstream
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Offline integrity (vendored corpus vs manifest)
        run: python tools/refresh_wycheproof_corpus.py --offline

      - name: Upstream provenance (vendored bytes vs C2SP/wycheproof @ pinned commit)
        run: python tools/refresh_wycheproof_corpus.py --verify

  keyformat-provenance:
    name: Verify key-format corpus against its source documents
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Offline integrity (structure, provenance, PEM shape, negative corpus)
        run: python tools/build_keyformat_corpus.py --verify

      - name: Upstream provenance (records vs RFC 9881 / 8410 / lamps-kyber-certificates)
        # Re-extracts every record from the document each corpus file names in
        # its own `source` block and requires them to match record-for-record.
        # Without this the vendored bytes are only self-consistent: a corpus
        # that never matched the RFC, or one an errata revision has moved on
        # from, verifies clean offline forever.
        run: python tools/build_keyformat_corpus.py --verify-upstream

  vector-provenance:
    name: Verify the published test vectors have not been rewritten
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pytest
        # The gate step below needs nothing but the standard library — that is
        # the point of pinning by digest rather than by re-fetch.  The anchor
        # test does need pytest, and the first revision of this job invoked it
        # without installing it: `No module named pytest`, exit 1, on a job
        # whose other two steps are plain scripts.  Pinned to the version
        # ci.yml installs so the two agree.
        run: pip install "pytest==9.1.1"

      - name: Every NIST/Ascon/POST vector must match its recorded digest
        # This repository's own pre-commit hooks rewrote these files.  The KAT
        # format spells an empty field as a key followed by a trailing space,
        # so `trailing-whitespace` turned `PT = ` into `PT =` across ML-KEM
        # (FIPS 203), ML-DSA (FIPS 204), SLH-DSA (FIPS 205) and Ascon.  The
        # hooks are scoped now; what made it worth a gate is that NOTHING
        # detected it — on the rewritten tree the corpus generators' --check,
        # check_corpus_originality.py, check_vendor_isolation.py and all 135
        # KAT tests still passed.
        #
        # No network: these bytes are pinned by digest in
        # tests/kat/PROVENANCE.json, the same shape wycheproof_vectors already
        # uses.  The manifest alone is not the whole guard —
        # tests/test_vector_provenance_gate.py pins four anchor digests in its
        # own source, so regenerating the manifest over a corrupted file does
        # not make it verify.
        run: python tools/check_vector_provenance.py

      - name: The manifest alone must not be sufficient (anchor digests)
        # AMA_POST_DIAGNOSTIC_IMPORT=1 because `tests/conftest.py` imports
        # `ama_cryptography` from `pytest_configure` (to name the
        # `SecurityWarning` category for the ini `filterwarnings` entry), and
        # since 5.0.0 a failed POST RAISES rather than logging.  This job
        # builds no native library — it hashes 37 tracked files with stdlib
        # `hashlib` and performs no cryptography at all — so without the flag
        # the run dies with `INTERNALERROR ... CryptoModuleError` and exit 3
        # before collecting a single test.  That is what happened at
        # `725f2f1`: the preceding revision fixed `No module named pytest` and
        # did not check that the job could then actually run the test.
        #
        # The flag completes the import for introspection only — the module
        # stays in the ERROR state and every cryptographic operation is still
        # refused — which is exactly the precedent ci.yml's documented-counts
        # step sets for a pytest invocation that runs no cryptography.  The
        # alternative, building and binding the library, would spend ~90 s of
        # a 10-minute budget to satisfy a warning-filter import.
        #
        # `tools/check_workflow_commands.py::check_pytest_prerequisites` now
        # fails the workflow sweep if any pytest-invoking step has neither a
        # preceding library build nor this flag, so this class of red lane is
        # caught before it is pushed rather than by CI.
        env:
          AMA_POST_DIAGNOSTIC_IMPORT: "1"
        run: python -m pytest tests/test_vector_provenance_gate.py -q

  vector-upstream:
    name: Verify the NIST/Ascon vectors against what upstream published
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: The vendored vectors must be what upstream published
        # The offline job above proves these bytes have not CHANGED since they
        # were vendored. It cannot prove they were ever what NIST published: a
        # corpus that never matched verifies clean forever, and the anchor
        # digests in tests/test_vector_provenance_gate.py were computed from
        # the same vendored bytes, so they inherit the same blind spot.
        #
        # This fetches. Ascon's two KATs and the 30 MB SLH-DSA sigVer
        # projection are compared byte for byte against immutable refs; the
        # ML-KEM ACVP derivative has the SHA-256 of each upstream input it
        # names re-checked, so it cannot quietly change which projection it
        # claims to come from. Everything else is recorded in PROVENANCE.json
        # as verified by another tool or as not establishable by fetch, WITH
        # the reason — and a pinned vector in neither bucket fails, so a new
        # corpus cannot arrive without someone deciding how its provenance is
        # established.
        run: python tools/check_vector_provenance.py --verify-upstream

  corpus-provenance-gate:
    name: Corpus Provenance Gate
    # Reads every dependency by name.  On a pull request that touches none of
    # the watched paths the lanes are skipped by their own condition and the
    # gate passes; on every other run each lane must succeed.  `changes` must
    # succeed either way: an undecided relevance is a failure.
    if: always()
    needs:
      - changes
      - provenance
      - keyformat-provenance
      - vector-provenance
      - vector-upstream
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fail unless every lane reached the state this change requires
        env:
          R_CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          R_0: ${{ needs['provenance'].result }}
          R_1: ${{ needs['keyformat-provenance'].result }}
          R_2: ${{ needs['vector-provenance'].result }}
          R_3: ${{ needs['vector-upstream'].result }}
        run: |
          set -euo pipefail
          rc=0
          if [ "${R_CHANGES}" != "success" ]; then
            echo "::error::changes did not succeed (${R_CHANGES}): relevance is unknown."
            exit 1
          fi
          if [ "${RELEVANT}" = "true" ]; then expected="success"; else expected="skipped"; fi
          echo "relevant=${RELEVANT}: every lane must be ${expected}"
          check() {
            if [ "$2" = "${expected}" ]; then
              echo "  OK    $1: $2"
            elif [ "${expected}" = "success" ] && [ "$2" = "skipped" ]; then
              echo "::error::$1 was SKIPPED but this trigger requires it to run."
              rc=1
            elif [ "${expected}" = "skipped" ]; then
              echo "::error::$1 ran ($2) but this trigger should skip it — its condition drifted."
              rc=1
            else
              echo "::error::$1 did not succeed: $2"
              rc=1
            fi
          }
          check provenance               "${R_0}"
          check keyformat-provenance     "${R_1}"
          check vector-provenance        "${R_2}"
          check vector-upstream          "${R_3}"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::Corpus Provenance Gate failed."
            exit 1
          fi
          echo "Corpus Provenance Gate passed."

