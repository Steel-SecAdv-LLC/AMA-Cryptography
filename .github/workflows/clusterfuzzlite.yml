name: ClusterFuzzLite

# Continuous fuzzing with OSS-Fuzz's own tooling on GitHub-hosted runners, without waiting for
# OSS-Fuzz onboarding.  ClusterFuzzLite is the ClusterFuzz engine packaged
# for CI: it builds the fuzzers from .clusterfuzzlite/ (which reuses
# oss-fuzz/build.sh), fuzzes them in BATCH mode for an hour per sanitizer
# every night, keeps the corpus between runs, prunes it weekly, and publishes
# a coverage report — the depth the 60-second per-PR lane in fuzzing.yml
# cannot reach, under three sanitizers rather than one.
#
# Corpora and coverage reports are stored as workflow artifacts (no
# storage repository is configured), which is what the action does when
# `storage-repo` is unset; each batch run starts from the newest corpus
# artifact of its fuzzer.
#
# Scheduled and manual only: this workflow never gates a pull request, so it
# needs no aggregating gate (tools/check_gate_coverage.py exempts workflows
# with no pull_request trigger).  Findings surface as failed runs on the
# schedule with the crashing input attached.
on:
  schedule:
    # Nightly batch fuzzing, 02:40 UTC (after fuzzing.yml's 02:20 deep run).
    - cron: '40 2 * * *'
    # Weekly corpus prune + coverage report, Sundays 05:00 UTC.
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Batch fuzzing time per sanitizer (seconds)'
        required: false
        default: '3600'

# actions: read — run_fuzzers downloads the previous run's corpus artifact
# through the Actions REST API with GITHUB_TOKEN; without it every batch run
# would start from the seeds and the corpus could not accumulate.
permissions:
  contents: read
  actions: read

concurrency:
  group: clusterfuzzlite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  batch:
    name: Batch fuzzing (${{ matrix.sanitizer }})
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, memory]
    steps:
      - name: Build the fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: c
          sanitizer: ${{ matrix.sanitizer }}

      - name: Fuzz (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event.inputs.fuzz_seconds || '3600' }}
          mode: 'batch'
          sanitizer: ${{ matrix.sanitizer }}
          parallel-fuzzing: true
          output-sarif: false

  prune:
    name: Prune the corpus
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 5 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Build the fuzzers (address)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: c
          sanitizer: address

      - name: Prune
        # Minimises the batch corpus to the units that keep its coverage.
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: 'prune'
          output-sarif: false

  coverage:
    name: Coverage report
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 5 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Build the fuzzers (coverage)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: c
          sanitizer: coverage

      - name: Coverage over the accumulated corpus
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: 'coverage'
          sanitizer: 'coverage'
          output-sarif: false
