#
# NO-OP TWIN of `.github/workflows/arm-qemu.yml` — GitHub's documented pattern for a
# path-filtered workflow whose gate context must be a REQUIRED status check.
#
# GitHub never creates a check run for a workflow that path filtering skipped.
# A required context from such a workflow therefore leaves every PR that does
# not touch those paths stuck on "Expected — waiting for status", so the
# context cannot be required at all — and `.github/workflows/arm-qemu.yml`'s own
# gate carried the comment "Branch protection should require ONLY this
# context" while nothing could. The consequence was that every AArch64 cross-test lane
# could go red without blocking a merge.
#
# This file has the SAME workflow `name:` and the SAME job `name:` as the gate
# it twins, and the COMPLEMENTARY `paths-ignore:` list, so exactly one of the
# two produces the `ARM QEMU Gate` context on any given pull request: the
# real one when the paths match, this one — trivially green — when they do not.
# tools/check_gate_coverage.py holds the two lists complementary.
name: ARM (QEMU) Cross-Test

on:
  pull_request:
    paths-ignore:
      - 'src/c/**'
      - 'include/**'
      - 'tests/c/**'
      - 'CMakeLists.txt'
      - 'cmake/toolchains/**'
      - 'cmake/ama_exports.map'
      - 'tools/check_secret_division.py'
      - '.github/workflows/arm-qemu.yml'
      - '.github/workflows/arm-qemu-skip.yml'

permissions:
  contents: read

concurrency:
  group: arm-qemu-skip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm-qemu-gate:
    name: ARM QEMU Gate
    # No dependencies, so `always()` changes nothing here — it is present
    # because tools/check_gate_coverage.py requires every `*-gate` job to
    # carry it, and a rule with an exception is a rule that erodes.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Nothing to verify for this change
        run: |
          echo "No path this gate watches was touched by this pull request."
          echo "The real lanes live in .github/workflows/arm-qemu.yml; this twin exists so the"
          echo "'ARM QEMU Gate' context is reported on every pull request and can"
          echo "therefore be a required status check."
