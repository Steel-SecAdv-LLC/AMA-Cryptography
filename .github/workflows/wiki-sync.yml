name: Sync Wiki

# RULESET / REQUIRED-CHECKS NOTE: this workflow only fires on push to
# `main` with `wiki/**` changes. The `sync-wiki` job is documentation
# publishing, not correctness, so it must NOT be added to the
# required-status-check ruleset on `main`. Same exclusion class as
# `dudect.yml` and `baseline-guard.yml`; see PR #289 'Deliberately not
# included' for the canonical list.
on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

# Serialize wiki publishes. The wiki is a separate git repository and
# two concurrent pushes would race each other on `git push origin HEAD`,
# leaving the wiki in a state where one of the two updates is silently
# lost. We deliberately do NOT cancel in-progress runs — cancelling
# mid-push could leave the wiki repo in a partial state. Queue instead.
concurrency:
  group: wiki-sync-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Publish wiki pages to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          # Try to clone the wiki. The GitHub wiki is a separate git repository
          # that only exists after at least one page has been created through the UI.
          #
          # Exactly one failure is a setup reminder rather than a broken
          # publish: the wiki repository not existing yet, which GitHub
          # reports as "Repository not found".  Every other clone failure —
          # a token without the permission, a network fault, a moved
          # repository — used to take the same branch and exit 0, so the
          # public wiki could go stale indefinitely with a green run and an
          # annotation nobody reads.  Those now fail the job.
          # No pipe here on purpose: this step runs under GitHub's default
          # `bash -e {0}`, which does not set pipefail, so `git clone | tee`
          # would report tee's status and every failure would read as success.
          clone_log="$(mktemp)"
          if git clone "$WIKI_URL" /tmp/wiki >"$clone_log" 2>&1; then
            cat "$clone_log"
            echo "✓ Cloned existing wiki repository."
          elif ! grep -qi "repository not found" "$clone_log"; then
            cat "$clone_log"
            echo "::error::Failed to clone the wiki repository for a reason other than it not existing yet — see the git output above (token permissions? network?). The wiki was NOT published."
            exit 1
          else
            cat "$clone_log"
            echo "::warning::The wiki repository does not exist yet — one-time setup required"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  WIKI NOT INITIALIZED — one-time setup required"
            echo ""
            echo "  The GitHub Wiki is a separate git repo that GitHub creates"
            echo "  only after the very first page is saved through the web UI."
            echo ""
            echo "  Complete these steps ONCE, then re-run this workflow:"
            echo ""
            echo "  1. Go to https://github.com/${{ github.repository }}/wiki"
            echo "  2. Click 'Create the first page'"
            echo "  3. Set the title to: Home"
            echo "  4. Paste any placeholder text (e.g. 'Initializing...')"
            echo "  5. Click 'Save Page'"
            echo "  6. Return to Actions → Sync Wiki → Run workflow"
            echo ""
            echo "  The workflow will then overwrite that placeholder with all"
            echo "  17 wiki pages from the wiki/ directory automatically."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            # Exit 0 only in this one state: nothing is published because
            # there is nowhere to publish to yet, and the steps above are
            # the remedy.  Any other clone failure exited 1 above.
            exit 0
          fi

          # Copy all wiki pages from the source tree into the cloned wiki repo
          cp -r wiki/. /tmp/wiki/

          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No wiki changes to publish — already up to date."
          else
            git commit -m "docs(wiki): sync from main repository"
            git push origin HEAD
            echo ""
            echo "✓ Wiki published successfully!"
            echo "  View at: https://github.com/${{ github.repository }}/wiki"
          fi
