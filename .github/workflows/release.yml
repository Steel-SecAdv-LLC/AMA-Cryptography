name: Release — Build, Sign, and Publish

# Tagged-release pipeline for ama-cryptography (audit Issue 1).
#
# INVARIANT-11 declares the SBOM as the release gate.  Prior to this
# workflow, `git tag --list` was empty and no `release.yml` existed;
# the `tags: ['v*']` triggers on acvp_validation.yml and security.yml
# would have fired once a tag was pushed, but nothing actually built
# and published a wheel.  This workflow closes the gap.
#
# The pipeline runs ONLY on `v*` tag pushes (and manual workflow_dispatch
# for dry-runs that don't publish).  Pull requests, branch pushes, and
# scheduled runs DO NOT trigger this workflow — release-grade signing
# keys (sigstore identity, PyPI Trusted Publishing) are only valid
# when the tag-protection ruleset is exercised, and a misconfigured
# trigger here is the easiest way to leak a published artefact.
#
# Stages, in order:
#
#   1. preflight       — re-derive the package version from the tag,
#                        regenerate the C-library SBOM, sanity check
#                        that the version-consistency script passes.
#                        FAILS the release if anything drifted.
#
#   2. build-wheels    — cibuildwheel matrix across Linux/macOS/Windows
#                        and Python 3.10–3.14.  Each wheel ships the
#                        Ed25519-signed _integrity_signature.py
#                        artefact via setup.py's AMA_BUILD_PIPELINE
#                        hook.
#
#   3. build-sdist     — single sdist (tarball) for completeness.
#
#   4. provenance      — slsa-framework/slsa-github-generator builds
#                        SLSA v1 provenance attestations over every
#                        wheel + the sdist.  The attestation lands in
#                        a sibling artefact and is uploaded to PyPI
#                        alongside the wheels via the trusted publisher.
#
#   5. sign            — sigstore-python signs each wheel + the sdist
#                        with the keyless OIDC-bound identity that
#                        GitHub Actions exposes.  Signatures live in
#                        the artefact alongside the binary they sign.
#
#   6. publish-pypi    — PyPI Trusted Publishing (no long-lived token).
#                        Requires the PyPI project's "trusted publisher"
#                        rule to permit
#                          repo = Steel-SecAdv-LLC/AMA-Cryptography
#                          workflow = release.yml
#                          environment = pypi
#                        Until this is configured on PyPI, publish-pypi
#                        is gated by the `environment: pypi` block on the
#                        deployment that requires manual approval.
#
#   7. github-release  — create the GitHub Release with the changelog,
#                        attach the wheels + sdist + provenance +
#                        signatures.
#
# Operator runbook:
#
#   1. Dry run FIRST, from the branch you intend to tag:
#
#        Actions -> "Release — Build, Sign, and Publish" -> Run workflow
#        (dry_run defaults to true; publish-pypi and github-release are
#        gated on a tag push and cannot fire from a dispatch.)
#
#      This is not optional ceremony.  Everything below stage 1 runs ONLY
#      on a tag push, so nothing else in CI ever executes it.  Four
#      independent release blockers reached production that way — a
#      cibuildwheel pin to a nonexistent commit, a retired `macos-13`
#      runner label, a `python -c` payload broken by YAML folding, and
#      POSIX quoting handed to cmd.exe — and the v3.2.0 and v3.3.0
#      releases both shipped with zero artefacts as a result.
#      tools/check_workflow_commands.py now catches those three classes
#      statically on every PR, but a dry run is the only thing that
#      exercises the real matrix against the real runner fleet.
#
#   2. Tag only after the dry run is green:
#
#        $ git tag -s v3.5.0 -m "ama-cryptography 3.5.0"
#        $ git push origin v3.5.0
#
# All of stages 1-7 then run automatically.  A failure in any stage halts
# the pipeline before the next; the published artefact is exactly the
# one that passed every gate.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build but do not publish (dry-run smoke test).'
        type: boolean
        default: true

# Top-level permissions are minimal.  Each job below grants the
# additional permissions it needs: id-token for OIDC; contents: write on
# the provenance job (the slsa-github-generator reusable workflow's
# internal upload-assets job statically requires it) and on the
# github-release job (to publish the release + assets).
permissions:
  contents: read

# Avoid clobbering an in-flight release if a maintainer accidentally
# pushes a second tag while the first is still building.  Cancellation
# is OFF — we never cancel a release in progress; the second tag must
# wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (tag + version + SBOM coherence)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_clean: ${{ steps.version.outputs.tag_clean }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Resolve tag → version (must match pyproject.toml)
        id: version
        run: |
          # When run via tag push, github.ref looks like refs/tags/vX.Y.Z.
          # When run via workflow_dispatch, github.ref is a branch — we
          # let the build proceed but mark it as a dry-run.  In either
          # case we anchor on pyproject.toml as the canonical version.
          tag="${GITHUB_REF##*/}"
          tag_clean="${tag#v}"
          pyproject_version=$(python -c "
          import re, sys
          from pathlib import Path
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"',
                        Path('pyproject.toml').read_text(encoding='utf-8'),
                        re.MULTILINE)
          if m is None:
              sys.exit('pyproject.toml has no [project].version')
          print(m.group(1))
          ")
          echo "Tag (raw):           $tag"
          echo "Tag (clean):         $tag_clean"
          echo "pyproject.toml:      $pyproject_version"
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "$tag_clean" != "$pyproject_version" ]; then
              echo "::error::Tag $tag_clean does not match pyproject.toml version $pyproject_version."
              echo "         Bump pyproject.toml (and all the artifacts tools/check_version_consistency.py"
              echo "         tracks) and re-tag from the new commit."
              exit 1
            fi
          fi
          {
            echo "version=$pyproject_version"
            echo "tag_clean=$tag_clean"
          } >> "$GITHUB_OUTPUT"

      - name: Run version consistency check
        # Cross-validate that every other version anchor (CMakeLists.txt,
        # include/ama_cryptography.h, docs/conf.py, Dockerfiles, etc.)
        # agrees with pyproject.toml.  This is the same check ci.yml
        # already runs; gating the release on it again is the
        # belt-and-suspenders pattern INVARIANT-11 expects.
        run: python tools/check_version_consistency.py

      - name: Regenerate + check SBOM
        # Audit Issue 2: SBOM is driven from pyproject.toml.  We
        # regenerate fresh and require the committed copy match,
        # exactly the same way security.yml::sbom does.
        run: python tools/generate_sbom.py --check

  build-wheels:
    name: cibuildwheel ${{ matrix.os }}
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # RUNNER LABELS ARE RELEASE-CRITICAL.  This matrix carried `macos-13`
        # long after GitHub retired that image; the job never got a runner,
        # sat queued until `timeout-minutes`, and failed build-wheels — and
        # with it every downstream release stage.  Nothing caught it because
        # release.yml only runs on a tag push.
        #
        # `macos-15-intel` (x86_64) and `macos-15` (arm64) are the current
        # generally-available macOS labels; `macos-14` is marked deprecated
        # upstream and was the next latent outage in this same matrix.  Both
        # architectures need their own runner because CIBW_ARCHS_MACOS=auto64
        # builds for the host architecture only.
        # tools/check_workflow_commands.py fails the build on retired labels.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Build wheels via cibuildwheel
        # Real v3.2.0 commit, verified with
        #   git ls-remote https://github.com/pypa/cibuildwheel.git refs/tags/v3.2.0^{}
        # The previous pin (e9c4a96e…) did not exist in pypa/cibuildwheel at
        # all — it matched neither the v3.2.0 tag object nor its commit — so
        # every wheel job aborted with "Unable to resolve action … unable to
        # find version".  That is why no release has ever produced artifacts.
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c  # v4.1.1
        env:
          # PYTHON VERSION MATRIX:
          # Build for the same Python range the test workflows already
          # cover (3.10–3.14).  That equality is the point: a wheel for an
          # interpreter no CI lane exercises ships untested, so cp314 was
          # added to ci.yml and ci-build-test.yml in the same commit as
          # this line. Keep the three in step.
          #
          # Skip PyPy and 32-bit musllinux variants; the native build under
          # setup.py CMakeBuild is x86-64 / arm64 only, and the ctypes shims
          # in ama_cryptography/ don't gain anything from PyPy's tracing JIT.
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp* *_i686 *_ppc64le *_s390x *-musllinux_*"
          CIBW_ARCHS_LINUX: "auto64"
          CIBW_ARCHS_MACOS: "auto64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          # WHEEL BUILD ENVIRONMENT:
          # AMA_BUILD_PIPELINE=1 enables setup.py's post-build integrity
          # signer.  The native-PQC and constant-time-AES guarantees are
          # NOT set here — they are enforced closer to the compiler, which
          # is why nothing needs to repeat them at this layer:
          #   * INVARIANT-7  — setup.py passes -DAMA_USE_NATIVE_PQC=ON
          #                    unconditionally, and CMakeLists.txt defaults
          #                    the option ON.
          #   * INVARIANT-20 — CMakeLists.txt defaults AMA_AES_CONSTTIME=ON
          #                    and *fails configuration* if it is turned off
          #                    without an explicit -DAMA_AES_TABLE_INSECURE=ON
          #                    acknowledgement, so a table-S-box wheel cannot
          #                    be produced by accident.
          # AMA_KYBER_BUILD_DIAGNOSTICS is INTENTIONALLY left unset so the
          # production wheels ship without the ~600 lines of printf-emitting
          # Kyber debug code (audit Issue 7).
          CIBW_ENVIRONMENT: >-
            AMA_BUILD_PIPELINE=1
            CMAKE_BUILD_PARALLEL_LEVEL=4
          # PRE-BUILD COMMANDS — install cmake + the cython/numpy build
          # deps that setup.py CMakeBuild needs.  cibuildwheel runs in
          # an isolated build env that only sees pyproject.toml's
          # [build-system].requires, so any missing build-time dep
          # fails the wheel build closed.
          #
          # Each requirement specifier is single-quoted so the cibuildwheel
          # subshell doesn't interpret `>=` as output redirection
          # (Copilot review #322 — without the quotes, `pip install
          # cmake>=4.4.0` runs as `pip install cmake` plus `>` redirect
          # to a file named `=4.4.0`, silently floating to whatever
          # pip resolves and missing the INVARIANT-8 toolchain floor).
          # Floors match pyproject.toml [build-system].requires + setup.py's
          # preflight so all three build-dependency sources stay in lockstep.
          #
          # The Windows variant uses DOUBLE quotes.  cibuildwheel runs
          # before-build commands through `cmd.exe` on Windows, where a single
          # quote is an ordinary character rather than a quoting operator, so
          # the POSIX form reached pip verbatim and every Windows wheel job
          # died on `Invalid requirement: "'cmake"`.  Double quotes are honoured
          # by cmd.exe *and* still shield `>=` from being read as redirection,
          # which is the property the quoting exists for in the first place.
          CIBW_BEFORE_BUILD_LINUX: "pip install 'cmake>=4.4.0' 'cython>=3.2.8' 'numpy>=1.24.0'"
          CIBW_BEFORE_BUILD_MACOS: "pip install 'cmake>=4.4.0' 'cython>=3.2.8' 'numpy>=1.24.0'"
          CIBW_BEFORE_BUILD_WINDOWS: 'pip install "cmake>=4.4.0" "cython>=3.2.8" "numpy>=1.24.0"'
          # MANYLINUX BASELINE: manylinux_2_28 has GCC 12 baseline (the
          # INVARIANT-8 minimum), AVX-512 intrinsics, and is supported
          # by every modern pip.
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          # TEST COMMAND: smoke-test the built wheel inside the throwaway
          # virtualenv cibuildwheel creates for it.  The full pytest suite
          # runs in ci-build-test.yml; this gate answers the narrower
          # question only a packaged build can answer — did the native
          # extension load, did anything degrade to a fallback backend,
          # does every shipped primitive round-trip and reject tampering.
          #
          # This is a FILE, not an inline `python -c`.  It used to be a
          # folded YAML scalar (`>-`), which joins the block's lines with a
          # space — so the payload reaching the interpreter began with a
          # leading space and every wheel on every platform died with
          # `IndentationError: unexpected indent` after building perfectly.
          # A script has no folding or shell-quoting layer between what is
          # written and what runs, and it can be executed locally.
          # tools/check_workflow_commands.py compiles any remaining inline
          # `python -c` payload so this cannot regress silently.
          CIBW_TEST_COMMAND: "python {project}/tools/wheel_smoke_test.py"

      - name: Upload wheel artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 30

  build-sdist:
    name: Build sdist
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 30

  # =========================================================================
  # Aggregate artefact digests — single SLSA provenance attestation over
  # the union of wheels + sdist.  The slsa-github-generator workflow
  # accepts a base64-encoded JSON document of {"name", "digest"} pairs;
  # we compute that here so the provenance job is matrix-free and the
  # attestation file is one .intoto.jsonl rather than one per OS.
  # =========================================================================
  hash-artefacts:
    name: Hash artefacts for SLSA subject set
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}
    steps:
      - name: Download wheel artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Download sdist artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist

      - name: Compute base64 subjects
        id: hash
        run: |
          # The SLSA generator expects a single base64-encoded string
          # containing one "DIGEST  FILENAME" line per artefact, in
          # the same shape sha256sum prints natively.  We sort to make
          # the output deterministic across re-runs.
          cd dist
          sha256sum *.whl *.tar.gz | LC_ALL=C sort > ../subjects.txt
          cd ..
          cat subjects.txt
          subjects_b64=$(base64 --wrap=0 subjects.txt)
          echo "subjects=$subjects_b64" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA v1 provenance attestation
    needs: [hash-artefacts]
    permissions:
      id-token: write       # OIDC for the keyless attestation
      # The slsa-github-generator reusable workflow's internal upload-assets
      # job statically declares `contents: write`.  A called workflow cannot be
      # granted more than the caller allows, so `contents: read` here fails the
      # whole run at startup ("nested job 'upload-assets' is requesting
      # 'contents: write', but is only allowed 'contents: read'") — even though
      # upload-assets is false.  The generator's documented caller permissions
      # require write; grant it here (the top-level default stays read).
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.hash-artefacts.outputs.subjects }}
      provenance-name: "ama-cryptography.intoto.jsonl"
      upload-assets: false

  # =========================================================================
  # Sigstore signing (sigstore-python) — keyless, OIDC-bound.  No long-
  # lived signing key sits on the runner.  The signature .sig + the
  # public certificate .crt ship alongside the wheel; verification uses
  # `sigstore verify identity`.
  # =========================================================================
  sign:
    name: Sigstore sign (wheels + sdist)
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Download sdist artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist

      - name: Sign distribution with sigstore-python
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1  # v3.4.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz
          upload-signing-artifacts: true
          release-signing-artifacts: false

      - name: Upload signed bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: signed-distribution
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sigstore
            dist/*.sigstore.json
          retention-days: 90

  # =========================================================================
  # PyPI Trusted Publishing — no long-lived token.  Requires the PyPI
  # project to have a "trusted publisher" configured for this repo /
  # workflow / environment trio.  The `environment: pypi` block gates
  # publishing on a maintainer approval click in the GitHub Actions
  # UI — that's an intentional human-in-the-loop barrier between a
  # tag push and a published release.
  # =========================================================================
  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: [preflight, sign, provenance]
    # Publish ONLY on tag pushes.  A manually-dispatched run from an
    # arbitrary branch ref bypasses the preflight tag-vs-pyproject
    # version check (which only fires under `github.event_name ==
    # 'push'`), so allowing workflow_dispatch + dry_run=false to
    # publish would let any branch land an unverified release on
    # PyPI.  Copilot review #322: restrict to `refs/tags/v*`.  The
    # workflow_dispatch dry-run path still exercises the entire
    # build/sign/provenance flow — it just stops before the upload.
    #
    # PyPI publishing is OPT-IN, gated on the repository variable
    # AMA_PUBLISH_TO_PYPI. Distributing through PyPI is a deliberate
    # operational choice, not a precondition for cutting a release: this
    # project also ships via git tags, GitHub Release assets and a private
    # index (see README "Distribution Channels"). Before this gate, a tag
    # pushed without a configured trusted publisher failed here AND took
    # github-release down with it, so the project could not produce a
    # GitHub Release at all without first committing to PyPI.
    #
    # Set the variable to 'true' (Settings -> Secrets and variables ->
    # Actions -> Variables) once the PyPI trusted publisher and the `pypi`
    # environment both exist. Leaving it unset skips publishing; the skip is
    # stated in the release notes rather than passing silently.
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && vars.AMA_PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ama-cryptography/${{ needs.preflight.outputs.version }}/
    permissions:
      id-token: write       # required for trusted publishing OIDC
    steps:
      - name: Download signed distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: signed-distribution
          path: dist

      - name: Filter to wheels + sdist (drop sigstore files)
        # pypa/gh-action-pypi-publish only wants the actual distributions,
        # not the .sigstore signature blobs that ride alongside them.
        # We move the signatures out of dist/ before the upload step.
        run: |
          mkdir -p signatures
          mv dist/*.sigstore* signatures/ 2>/dev/null || true
          ls -la dist/
          ls -la signatures/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          packages-dir: dist/
          # No `password` — Trusted Publishing handles OIDC exchange.
          # Skip-existing avoids breaking on re-runs of a partial
          # publish, but if a wheel has actually changed bytes since
          # the prior partial upload, that's a worse problem we want
          # to surface, not skip.  Off by default; flip to true only
          # after the first failed-mid-upload incident.
          skip-existing: false
          verbose: true

  github-release:
    name: Create GitHub Release
    # MUST depend on publish-pypi (Copilot review #322).  Without it,
    # a tag push that succeeds at sign+provenance but fails at PyPI
    # upload (rejected by the trusted-publisher rule, environment
    # approval timeout, transient PyPI 5xx) would still publish the
    # GitHub Release with body text "Published to PyPI" — false
    # advertising and a credibility hit.  Sequencing via `needs` makes
    # the release announcement strictly downstream of the PyPI upload.
    needs: [preflight, sign, provenance, publish-pypi]
    #
    # The original guard was a bare `needs: [... publish-pypi]`, which is
    # correct about the hazard (never announce a PyPI upload that failed) but
    # conflates two different outcomes. `needs` treats SKIPPED the same as
    # FAILED, so with PyPI publishing opt-in (see publish-pypi above) a
    # deliberately unconfigured PyPI would silently suppress the GitHub
    # Release too — no assets, no signatures, no provenance published, for a
    # tag that built everything successfully.
    #
    # This condition keeps the safety property and drops the conflation:
    #   * publish-pypi FAILED   -> no release  (the original hazard)
    #   * publish-pypi SKIPPED  -> release proceeds, notes say PyPI was skipped
    #   * sign / provenance not successful -> no release, unconditionally
    #
    # Bracket indexing, not dot notation: `needs.publish-pypi.result` asks an
    # expression grammar in which `-` is also subtraction to read a hyphenated
    # job id as a single identifier.  No other workflow here dereferences a
    # hyphenated job name, so there is no in-repo evidence the dot form is
    # safe, and this file only ever executes on a tag push — the one place a
    # wrong guess is discovered at the worst moment.  `needs['publish-pypi']`
    # is unambiguous under any reading.
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.sign.result == 'success'
      && needs.provenance.result == 'success'
      && needs['publish-pypi'].result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artefacts

      - name: Resolve the PyPI line for the release notes
        id: pypi_line
        # Computed in a step rather than inline in the release body.  The
        # inline form needed a multi-line ${{ }} expression inside a `|` block
        # scalar — syntax that nothing in CI would ever exercise, because this
        # workflow only runs on a tag push.  That is the same class of defect
        # (invisible until release day) that INVARIANT-25 exists to catch, so
        # it does not belong in the fix for it.  A shell conditional over a
        # single simple expression is testable by reading it.
        env:
          PYPI_RESULT: ${{ needs['publish-pypi'].result }}
        run: |
          if [ "$PYPI_RESULT" = "success" ]; then
            line="published via Trusted Publishing (no long-lived token)."
          else
            line="not published — PyPI distribution is not enabled for this repository. Install from this release's assets, a git tag, or the private index (see README, Distribution Channels)."
          fi
          echo "line=$line" >> "$GITHUB_OUTPUT"
          echo "PyPI publish result: ${PYPI_RESULT:-<none>}"

      - name: Aggregate release assets
        run: |
          mkdir -p release-assets
          # Wheels & sdist
          find artefacts -name '*.whl' -exec cp {} release-assets/ \;
          find artefacts -name '*.tar.gz' -exec cp {} release-assets/ \;
          # Sigstore signatures
          find artefacts -name '*.sigstore*' -exec cp {} release-assets/ \;
          # SLSA provenance attestations
          find artefacts -name '*.intoto.jsonl' -exec cp {} release-assets/ \;
          # SBOM (committed)
          cp docs/compliance/sbom-c-library.json release-assets/
          ls -la release-assets/

      # IMMUTABLE RELEASES: assets freeze at publish, so every asset must be
      # attached while the release is still a draft.  At the pinned v3.0.1 this
      # holds without further configuration, and the ordering is worth stating
      # because it is the whole reason this step is safe:
      #
      #   * createRelease()  — `draft = prerelease === true ? input_draft : true`,
      #                        so a NON-prerelease is always created as a draft.
      #   * updateRelease()  — passes `draft: existingRelease.draft`, i.e. it
      #                        preserves the draft state rather than publishing
      #                        early, so reusing a hand-written draft is safe.
      #   * main.ts          — release() -> upload every file -> finalizeRelease(),
      #                        and only finalizeRelease() sets `draft: false`.
      #
      # Nothing else may attach assets to the release: the provenance job sets
      # `upload-assets: false` and the sign job sets
      # `release-signing-artifacts: false`, so this step is the single writer
      # and nothing can race the freeze.
      #
      # DO NOT HAND-CREATE A DRAFT RELEASE FOR THE TAG BEFOREHAND.  The action
      # locates an existing release with findTagFromReleases() -> getReleaseByTag(),
      # i.e. `GET /releases/tags/{tag}`, which GitHub documents as "Get a
      # PUBLISHED release with the specified tag".  A draft has no git tag, so
      # that call 404s, the action falls through to createRelease(), and the
      # repository ends up with two releases for one tag: the orphaned draft and
      # the one this workflow just made.  This step must own release creation.
      #
      # Long-form release notes are applied by EDITING THE PUBLISHED RELEASE
      # afterwards.  Immutable releases freeze the tag and the assets only — the
      # title and notes stay editable — so the write-up can land after publish
      # without weakening anything this pipeline guarantees.
      #
      # The two inputs below then protect that hand-edited text if this workflow
      # is ever re-run for the same tag (a re-run finds the now-published
      # release and takes the update path).  Without them a re-run silently
      # resets the title to the bare tag and overwrites the notes.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          # `name:` is deliberately NOT set.  On the update path the action
          # resolves `input_name || existingRelease.name || tag`, so passing
          # `${{ github.ref_name }}` would reset a hand-edited release title
          # back to the bare tag ("v3.4.0") on any re-run.  Omitting it keeps
          # the edited title.  On the create path the action already falls back
          # to `input_name || tag` — the identical bare-tag title this
          # previously set explicitly — so a first run is unchanged.
          body: |
            AMA Cryptography ${{ needs.preflight.outputs.version }}

            * Wheels signed via sigstore (keyless, OIDC-bound).
            * SLSA v1 provenance attestations attached.
            * C-library SBOM (CycloneDX) attached; the Python SBOM is published per-commit by security.yml as the `sbom` workflow artifact.
            * PyPI: ${{ steps.pypi_line.outputs.line }}

            Verify with:

                $ pip install sigstore slsa-verifier
                $ sigstore verify identity --bundle DOWNLOAD.sigstore.json \
                    --cert-identity https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }} \
                    --cert-oidc-issuer https://token.actions.githubusercontent.com \
                    DOWNLOAD.whl
                $ slsa-verifier verify-artifact DOWNLOAD.whl \
                    --provenance-path DOWNLOAD.intoto.jsonl \
                    --source-uri github.com/${{ github.repository }} \
                    --source-tag ${{ github.ref_name }}

            See the full release notes in CHANGELOG.md.
          files: release-assets/*
          # Protects hand-edited release notes across a re-run.  On the update
          # path the body otherwise resolves as
          # `workflowBody || existingReleaseBody` — the workflow body wins and
          # the edited notes are destroyed.  With this set, the existing body is
          # kept and the verification block above is appended to it
          # (`existingReleaseBody + "\n" + workflowBody`).  createRelease() does
          # not consult this input at all, so a first run is unchanged and still
          # gets the workflow body verbatim.
          append_body: true
          # Draft the PRERELEASE case only.  A non-prerelease resolves to false
          # and is published by finalizeRelease() once the assets are attached
          # (the v3.4.0 path).  A prerelease must stay a draft instead: the
          # action only auto-drafts non-prereleases, so a published `-rc` would
          # be frozen by immutable releases before its assets uploaded and the
          # job would die on "Cannot upload assets to an immutable release".
          # This mirrors the guidance in the action's own `draft` input docs.
          # Consequence: a prerelease is left as a draft for a maintainer to
          # publish by hand, and it fires `release.published` rather than
          # `release.prereleased`.
          draft: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
