#
# Baseline.json change guard.
#
# Any PR that modifies `benchmarks/baseline.json` or
# `benchmarks/arm-baseline.json` must carry, in the PR
# body and/or the commits touching the file, a line-item justification
# per primitive, at least one measured ops/sec (or latency) reading, and
# an identifier for the CI runner on which the measurement was taken.
# See benchmarks/check_baseline_justification.py for the full contract
# and docs/BENCHMARK_HISTORY.md for the motivating history.
#
# RULESET / REQUIRED-CHECKS NOTE: this workflow runs on EVERY pull request so
# its 'Enforce baseline JSON justification' context is always reported and can
# be a required status check.  The `changes` job decides relevance; on a pull
# request that touches none of the watched paths the guard job is skipped by
# its own condition, which GitHub reports as a passing check.  It replaced a
# path-filtered workflow plus a no-op twin (baseline-guard-skip.yml) that were
# not exclusive -- see tools/pr_touches_watched_paths.py.

name: Baseline Change Guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Collapse overlapping runs on the same ref; PR heads cancel in-flight
# runs so a rapid series of pushes doesn't hold a runner for each.
concurrency:
  group: baseline-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

jobs:
  # Every pull request runs this workflow, and this job decides whether the
  # change touches anything the jobs below verify.  It replaced a path-filtered
  # workflow plus a no-op twin that reported the same context: the two were not
  # exclusive (paths: fires when ANY changed file matches, paths-ignore: when ANY
  # is not ignored), so a mixed pull request ran both and the twin's green
  # arrived first.  tools/pr_touches_watched_paths.py has the full account.  A
  # failed detection is a failure, never "not relevant".
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.match.outputs.relevant }}
    steps:
      - name: Checkout (the merge commit and its base parent)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Does this change touch a watched path?
        id: match
        env:
          EVENT: ${{ github.event_name }}
          WATCHED_PATHS: |
            benchmarks/baseline.json
            benchmarks/arm-baseline.json
            benchmarks/check_baseline_justification.py
            .github/workflows/baseline-guard.yml
            tools/pr_touches_watched_paths.py
        run: python3 tools/pr_touches_watched_paths.py --event "$EVENT"

  baseline-justification:
    name: Enforce baseline JSON justification
    needs: [changes]
    # Runs when the change is relevant, and whenever relevance could not be
    # decided (the first step then fails): a failed `changes` job must not
    # read as the passing skip an irrelevant change produces.
    if: >-
      always()
      && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Relevance was decided
        if: needs.changes.result != 'success'
        run: |
          echo "::error::The changes job did not succeed (${{ needs.changes.result }}); the guard cannot know whether it applies."
          exit 1

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # We need the full history so `git show <base>:<path>` and
          # `git log <base>..HEAD -- <path>` both work inside the checker.

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Resolve base ref
        id: base
        run: |
          # For a PR, github.event.pull_request.base.sha is the merge-base
          # commit on the target branch. We use that rather than
          # origin/main because the PR may target a non-main branch.
          echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"

      - name: Run baseline justification guard
        env:
          # Write the PR body to a file first; passing it via the shell
          # would be unsafe for bodies containing quotes, backticks, $,
          # or backslashes. The script reads the file verbatim.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          python benchmarks/check_baseline_justification.py \
            --base-ref "${{ steps.base.outputs.sha }}" \
            --head-ref HEAD \
            --pr-body-file /tmp/pr-body.txt
