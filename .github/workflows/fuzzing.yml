name: CI - Fuzzing (libFuzzer)

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      fuzz_duration:
        description: 'Fuzzing duration per target (seconds)'
        required: false
        default: '60'

permissions:
  contents: read

# Collapse overlapping runs on the same ref so rapid pushes don't
# saturate the runner queue (libFuzzer builds plus 11 matrix targets
# per trigger × 2 triggers = 22+ concurrent jobs per push).  Feature
# branches and PR heads cancel previous in-flight runs; main and
# scheduled runs are preserved.
concurrency:
  group: fuzzing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

jobs:
  fuzz-core:
    name: Fuzz Core Primitives (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_sha3
          - fuzz_ed25519
          - fuzz_aes_gcm
          - fuzz_hkdf
          - fuzz_consttime
          # Agent-instance binding (INVARIANT-30): the only surface in the
          # tree that parses a structured record and turns it into a policy
          # verdict, so it is fuzzed for fail-closed behaviour, not just for
          # memory safety.  Core (non-PQC) — needs SHA3/HMAC/HKDF only.
          - fuzz_agent_binding
          # Ascon (NIST SP 800-232).  Asserts security properties rather than
          # absence of crashes: round-trip fidelity, tag-forgery rejection,
          # associated-data binding (including the empty-AD guard), the
          # fail-closed contract, and hash determinism.  Core (non-PQC) —
          # ama_ascon.c depends on no other primitive in this library.
          - fuzz_ascon

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          # Remove non-essential third-party apt repos that may cause 403 errors on runners
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          .github/scripts/apt-install.sh cmake clang libclang-rt-dev

      - name: Build fuzz targets
        run: |
          cmake -B build-fuzz \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -g" \
            -DAMA_BUILD_FUZZ=ON \
            -DAMA_BUILD_TESTS=OFF \
            -DAMA_BUILD_EXAMPLES=OFF \
            -DAMA_ENABLE_LTO=OFF \
            -DAMA_USE_NATIVE_PQC=ON
          cmake --build build-fuzz --target ${{ matrix.target }} -j$(nproc)

      - name: Run fuzzer (${{ matrix.target }})
        env:
          FUZZ_DURATION: ${{ github.event.inputs.fuzz_duration || '60' }}
        # Seeds the corpus from fuzz/seed_corpus/<target>/ and loads
        # fuzz/dictionaries/<target>.dict when they exist.  Before this, the
        # run started from an EMPTY corpus with no dictionary, so both trees
        # were carried in the repository but never reached the fuzzer — every
        # run rediscovered basic structure from zero inside its 60s budget.
        # `validate-fuzz-dictionaries` (below) guarantees the dict actually
        # parses, because libFuzzer discards a whole dictionary on the first
        # malformed line and only warns.
        run: |
          set -euo pipefail
          mkdir -p corpus/${{ matrix.target }}
          mkdir -p artifacts/${{ matrix.target }}
          if [ -d "fuzz/seed_corpus/${{ matrix.target }}" ]; then
            cp -r fuzz/seed_corpus/${{ matrix.target }}/. corpus/${{ matrix.target }}/
            echo "Seeded corpus with $(ls -1 corpus/${{ matrix.target }} | wc -l) input(s)."
          else
            echo "No seed corpus for ${{ matrix.target }} — starting cold."
          fi
          DICT_ARG=""
          if [ -f "fuzz/dictionaries/${{ matrix.target }}.dict" ]; then
            DICT_ARG="-dict=fuzz/dictionaries/${{ matrix.target }}.dict"
            echo "Using dictionary fuzz/dictionaries/${{ matrix.target }}.dict"
          fi
          # The ceiling comes from the harness, not from a number written
          # here.  libFuzzer never generates a unit longer than -max_len and
          # TRUNCATES corpus units to it, so a target whose deepest branch
          # needs more bytes than this can never enter that branch — measured:
          # fuzz_dilithium's fully-fuzzed ML-DSA verify needs 5,262 bytes and
          # fuzz_sphincs' two SLH-DSA verify cases need 49,921 and 49,857,
          # against the 4,096 that used to be hard-coded here.  Those branches
          # had never executed in any run.
          MAX_LEN="$(python3 tools/check_fuzz_input_reachability.py \
                       --max-len ${{ matrix.target }})"
          echo "Fuzzing ${{ matrix.target }} for ${FUZZ_DURATION}s (-max_len=$MAX_LEN)..."
          ./build-fuzz/bin/${{ matrix.target }} \
            -max_total_time=${FUZZ_DURATION} \
            -max_len="$MAX_LEN" \
            ${DICT_ARG} \
            -artifact_prefix=artifacts/${{ matrix.target }}/ \
            corpus/${{ matrix.target }}/

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/
          retention-days: 30

  # ---------------------------------------------------------------------
  # Dictionary validity gate
  # ---------------------------------------------------------------------
  # libFuzzer's ParseDictionaryFile aborts on the FIRST malformed line and
  # then runs with NO dictionary at all, printing only a one-line notice that
  # is easy to miss in a 60-second fuzz log.  A single `kw=""` entry therefore
  # silently disables every other keyword in that file.  Three dictionaries in
  # this repository were in exactly that state (fuzz_sha3, fuzz_hkdf,
  # fuzz_argon2) and had been since they were added.
  #
  # This job parses every dictionary with a real libFuzzer binary and fails
  # closed on any rejection, so a malformed dictionary can never again degrade
  # fuzzing quality without failing the build.
  validate-fuzz-dictionaries:
    name: Validate fuzz dictionaries (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          .github/scripts/apt-install.sh cmake clang libclang-rt-18-dev

      - name: Build one fuzz target (dictionary parser host)
        run: |
          # -O2 -g with NDEBUG stripped, matching every other fuzz configure
          # in this file.  This was `Debug` (-O0) on the stated ground that
          # "Release would append -fomit-frame-pointer after them and cost the
          # stack traces a crash report is for" — measured false: CMake appends
          # the target's own flags AFTER CMAKE_C_FLAGS_<CONFIG>, and
          # fuzz/CMakeLists.txt ends its FUZZ_FLAGS with -fno-omit-frame-pointer,
          # so the frame pointer survives at every build type (checked in the
          # emitted flags.make of a Release fuzz configure).  What -O0 did cost
          # is depth: at 60 s per target, one seed corpus and the same -max_len,
          # -O2 -g reached 3.0x to 16.7x more executions per target than -O0
          # (docs/audit/PR394_FUZZ_DEPTH.tsv vs PR394_FUZZ_DEPTH_O2G.tsv;
          # fuzz_sphincs 20 -> 116, fuzz_frost 515 -> 5,627, fuzz_dilithium
          # 1,748 -> 7,167).  NDEBUG is left OUT so assert() stays live exactly
          # as it was under Debug — the ONLY semantic difference between the two
          # configurations is the optimisation level.
          cmake -B build-fuzz -DAMA_BUILD_FUZZ=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -g" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DAMA_USE_NATIVE_PQC=ON
          cmake --build build-fuzz --target fuzz_sha3 -j$(nproc)

      - name: Every dictionary must parse
        run: |
          set -uo pipefail
          rc=0
          for d in fuzz/dictionaries/*.dict; do
            # -runs=0 loads the dictionary, then exits without fuzzing.
            out=$(./build-fuzz/bin/fuzz_sha3 -dict="$d" -runs=0 2>&1 || true)
            if echo "$out" | grep -q "ParseDictionaryFile"; then
              echo "::error file=$d::libFuzzer rejected this dictionary — the WHOLE file is discarded at runtime. $(echo "$out" | grep ParseDictionaryFile | head -1)"
              rc=1
            else
              echo "ok: $d"
            fi
          done
          exit $rc

      - name: Generated seed corpora must match their generators
        # Two corpora are produced by a script rather than by hand, so that
        # what each seed covers is stated and reproducible.  Both scripts have
        # a --check mode and NEITHER was wired to anything, which makes the
        # generator and the committed bytes free to drift apart silently —
        # and a corpus that no longer matches its documented rationale is a
        # corpus whose rationale is fiction.  This is the step that notices.
        run: |
          set -euo pipefail
          python3 tools/build_ascon_seed_corpus.py --check
          python3 tools/build_kyber_seed_corpus.py --check
          python3 tools/build_pqc_verify_seed_corpus.py --check

      - name: Every harness branch must be reachable by its own lane
        # Registration (check_fuzz_target_registration.py) says a harness
        # RUNS.  This says its branches can be ENTERED: libFuzzer never
        # generates a unit longer than -max_len and truncates corpus units to
        # it, so a guard above that ceiling is a branch no run can reach.
        # fuzz_dilithium's fully-fuzzed ML-DSA verify and both of
        # fuzz_sphincs' SLH-DSA verify cases sat above it and had never
        # executed.
        run: python3 tools/check_fuzz_input_reachability.py

  fuzz-pqc:
    name: Fuzz PQC Primitives (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_dilithium
          - fuzz_kyber
          - fuzz_chacha20poly1305
          - fuzz_x25519
          - fuzz_argon2
          - fuzz_secp256k1
          - fuzz_frost
        # SPHINCS+ is too slow for CI fuzzing — run manually
        # - fuzz_sphincs

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          # Remove non-essential third-party apt repos that may cause 403 errors on runners
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          .github/scripts/apt-install.sh cmake clang libclang-rt-dev

      - name: Build fuzz targets
        run: |
          cmake -B build-fuzz \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -g" \
            -DAMA_BUILD_FUZZ=ON \
            -DAMA_BUILD_TESTS=OFF \
            -DAMA_BUILD_EXAMPLES=OFF \
            -DAMA_ENABLE_LTO=OFF \
            -DAMA_USE_NATIVE_PQC=ON
          cmake --build build-fuzz --target ${{ matrix.target }} -j$(nproc)

      - name: Run fuzzer (${{ matrix.target }})
        env:
          FUZZ_DURATION: ${{ github.event.inputs.fuzz_duration || '60' }}
        # Same seed-corpus + dictionary wiring as the core lane above; see the
        # comment there for why both were previously unused at runtime.
        run: |
          set -euo pipefail
          mkdir -p corpus/${{ matrix.target }}
          mkdir -p artifacts/${{ matrix.target }}
          if [ -d "fuzz/seed_corpus/${{ matrix.target }}" ]; then
            cp -r fuzz/seed_corpus/${{ matrix.target }}/. corpus/${{ matrix.target }}/
            echo "Seeded corpus with $(ls -1 corpus/${{ matrix.target }} | wc -l) input(s)."
          else
            echo "No seed corpus for ${{ matrix.target }} — starting cold."
          fi
          DICT_ARG=""
          if [ -f "fuzz/dictionaries/${{ matrix.target }}.dict" ]; then
            DICT_ARG="-dict=fuzz/dictionaries/${{ matrix.target }}.dict"
            echo "Using dictionary fuzz/dictionaries/${{ matrix.target }}.dict"
          fi
          # The ceiling comes from the harness, not from a number written
          # here.  libFuzzer never generates a unit longer than -max_len and
          # TRUNCATES corpus units to it, so a target whose deepest branch
          # needs more bytes than this can never enter that branch — measured:
          # fuzz_dilithium's fully-fuzzed ML-DSA verify needs 5,262 bytes and
          # fuzz_sphincs' two SLH-DSA verify cases need 49,921 and 49,857,
          # against the 4,096 that used to be hard-coded here.  Those branches
          # had never executed in any run.
          MAX_LEN="$(python3 tools/check_fuzz_input_reachability.py \
                       --max-len ${{ matrix.target }})"
          echo "Fuzzing ${{ matrix.target }} for ${FUZZ_DURATION}s (-max_len=$MAX_LEN)..."
          ./build-fuzz/bin/${{ matrix.target }} \
            -max_total_time=${FUZZ_DURATION} \
            -max_len="$MAX_LEN" \
            ${DICT_ARG} \
            -artifact_prefix=artifacts/${{ matrix.target }}/ \
            corpus/${{ matrix.target }}/

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/
          retention-days: 30

  # ---------------------------------------------------------------------
  # Python parser lane
  # ---------------------------------------------------------------------
  # The DER, CBOR, JSON and PEM key parsers are hostile-input parsers in
  # exactly the sense the fifteen C harnesses above are: anyone who can hand
  # you a key file reaches them. They had no harness — only a fixed
  # 120-mutation sweep inside pytest, which explores the same neighbourhood
  # on every run for ever and is not fuzzing.
  #
  # The harness is AMA's own: its generator, mutator and seed corpus are in
  # fuzz/python/fuzz_key_formats.py, so this lane depends on no third-party
  # fuzzing engine. (Atheris is supported via --atheris when it happens to be
  # installed, deliberately as a bonus rather than as the lane.)
  #
  # It found three real defects on its first campaigns: a UnicodeDecodeError
  # leaking out of _as_der, a TypeError from an unhashable CBOR map value
  # reaching a dict lookup in _cose_algorithm, and a strict-PEM parser that
  # accepted trailing 0x1C-0x1F because Python's str.strip() counts them as
  # whitespace and RFC 7468 does not.
  fuzz-python-parsers:
    name: Fuzz Python key parsers (DER / CBOR / JSON / PEM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          .github/scripts/apt-install.sh cmake build-essential

      - name: Build the native library
        # The parsers call into the native backend for key derivation and the
        # PQ consistency checks, so the harness needs a real library rather
        # than a stub — fuzzing a parser whose validation is stubbed out
        # exercises the DER layer and nothing behind it.
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAMA_USE_NATIVE_PQC=ON \
            -DAMA_BUILD_TESTS=OFF -DAMA_BUILD_EXAMPLES=OFF
          cmake --build build -j$(nproc)

      - name: Bind the freshly-built library into the integrity artefact
        # A library built here is not the library the committed artefact was
        # signed over, and since 5.0.0 a digest mismatch is refused BEFORE the
        # object is mapped rather than reported after — so without this step
        # the harness cannot import the package it is meant to fuzz, and the
        # job fails on the import rather than on a parser defect.
        #
        # Every other job that builds the library and then imports the package
        # already does this (ci.yml, ci-build-test.yml, integrity-anchor-
        # check.yml); this one built the library and skipped the step, which
        # only became visible once the refusal stopped being demotable.
        #
        # This is the positive path (a valid signature verifies). Tamper
        # DETECTION is covered by tests/test_native_integrity.py on a
        # purpose-built tree, so re-signing here removes no coverage.
        env:
          AMA_BUILD_PIPELINE: "1"
        run: python -m ama_cryptography.integrity --update --sign

      - name: Fuzz the key parsers
        env:
          FUZZ_DURATION: ${{ github.event.inputs.fuzz_duration || '60' }}
        # Two campaigns from different seeds rather than one long run: the seed
        # is the whole reproduction recipe for this engine, so two independent
        # starting points cover more than twice the wall clock would.
        run: |
          set -euo pipefail
          python3 fuzz/python/fuzz_key_formats.py \
            --seconds "${FUZZ_DURATION}" \
            --artifact-dir artifacts/python-parsers
          python3 fuzz/python/fuzz_key_formats.py \
            --seconds "${FUZZ_DURATION}" \
            --seed 20260727 \
            --artifact-dir artifacts/python-parsers

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-crashes-python-parsers
          path: artifacts/python-parsers/
          retention-days: 30

  fuzz-consttime-aes:
    name: Fuzz AES-GCM (constant-time bitsliced backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          # Remove non-essential third-party apt repos that may cause 403 errors on runners
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          .github/scripts/apt-install.sh cmake clang libclang-rt-dev

      - name: Build with constant-time AES
        run: |
          cmake -B build-fuzz-ct \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -g" \
            -DAMA_BUILD_FUZZ=ON \
            -DAMA_BUILD_TESTS=OFF \
            -DAMA_BUILD_EXAMPLES=OFF \
            -DAMA_ENABLE_LTO=OFF \
            -DAMA_AES_CONSTTIME=ON \
            -DAMA_USE_NATIVE_PQC=ON
          cmake --build build-fuzz-ct --target fuzz_aes_gcm -j$(nproc)

      - name: Run AES-GCM fuzzer (consttime backend)
        run: |
          mkdir -p corpus/fuzz_aes_gcm_ct
          mkdir -p artifacts/fuzz_aes_gcm_ct
          # Same derivation as the main lanes — see the comment there.  This
          # target's deepest branch fits well inside the floor, but a ceiling
          # written by hand is the defect, not the number it happens to hold.
          MAX_LEN="$(python3 tools/check_fuzz_input_reachability.py \
                       --max-len fuzz_aes_gcm)"
          ./build-fuzz-ct/bin/fuzz_aes_gcm \
            -max_total_time=30 \
            -max_len="$MAX_LEN" \
            -artifact_prefix=artifacts/fuzz_aes_gcm_ct/ \
            corpus/fuzz_aes_gcm_ct/

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-crashes-aes-gcm-consttime
          path: artifacts/fuzz_aes_gcm_ct/
          retention-days: 30

  # Constant-time verification of the legacy tools/constant_time/ harnesses
  # lives in .github/workflows/dudect.yml :: dudect-legacy-harnesses.  That
  # job runs the same `dudect_harness 50000` and `dudect_crypto 50000`
  # invocations under `taskset -c 0 nice -n -10` (single-core pinning +
  # elevated priority) and `cmake --build -j$(nproc)`, both of which the
  # earlier in-file `constant-time-crypto` job lacked.  Keeping a second,
  # un-pinned copy here only multiplied flake exposure on contended
  # runners without adding coverage.

  fuzzing-gate:
    name: Fuzzing Gate
    # Single aggregating status check for this workflow. Branch protection
    # should require ONLY this context instead of the individual job names:
    # adding, renaming, or matrix-expanding a job then updates this needs:
    # list under code review rather than drifting the branch-protection
    # config out of sync (required-context drift). `needs:` is
    # workflow-local, so every workflow carries its own gate.
    #
    # if: always() so the gate resolves to a definitive red/green even when a
    # dependency fails — otherwise it would report as `skipped` and leave the
    # PR stuck "waiting for status".
    if: always()
    needs:
      - fuzz-core
      - fuzz-pqc
      - fuzz-python-parsers
      - fuzz-consttime-aes
      - validate-fuzz-dictionaries
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - name: Fail if any required job did not succeed
      # STRICT: anything other than `success` is a failure, so a `skipped` or
      # `cancelled` dependency cannot report green. Every job in this
      # workflow is unconditional (no job-level `if:`), so on any trigger
      # they are all expected to run to completion — a skip here would mean
      # something silently did not happen, which is exactly what this gate
      # exists to catch.
      if: ${{ contains(needs.*.result, 'failure')
             || contains(needs.*.result, 'cancelled')
             || contains(needs.*.result, 'skipped') }}
      run: |
        echo "::error::Fuzzing Gate failed — a required job did not succeed."
        echo "Dependency results: ${{ join(needs.*.result, ', ') }}"
        exit 1
    - name: All required jobs succeeded
      run: echo "Fuzzing Gate passed — all required jobs are green."
