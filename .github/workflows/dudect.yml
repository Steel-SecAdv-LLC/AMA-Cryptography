name: CI - dudect Constant-Time Verification

# RULESET / REQUIRED-CHECKS NOTE
# ------------------------------
# This workflow is path-filtered to PRs that touch C source / dudect
# harness code (see `paths:` blocks below).  Audit Issue 11 widened the
# trigger to also include include/** (where ama_dispatch.h declares
# which SIMD slot is taken) and ama_cryptography/** (the Python-side
# nonce state and ctypes shims that select between scalar / SIMD code
# paths).  A change in either of those trees can flip which dispatch
# lane the production library hits at runtime without modifying any
# file under src/c/ — and before this widening the dudect gate would
# silently skip such PRs.
#
# PRs that don't touch any of those paths still won't trigger this
# workflow, so its named jobs do NOT emit a status check on such PRs.
# Consequence for branch rulesets: do NOT add these names to the
# `main` branch's required-status-check list.  A required check that
# is never reported on path-filtered PRs blocks merge indefinitely
# with 'Expected — Waiting for status to be reported'.  Same reasoning
# as `baseline-guard.yml::Enforce baseline.json justification` and the
# wiki-sync job — see PR #289 description ('Deliberately not included')
# for the canonical exclusion list.
#
# The dudect gate still fails closed when it DOES run (no
# `continue-on-error`, no silent skips inside the harness), which is
# the regression case it exists to catch.
#
# The nightly `dudect-simd-sweep` job (added 2026-05 — audit Issue 3)
# runs unconditionally on a cron schedule even when no path-filter
# fires, so the per-PR coverage shrinks to "changed code" and the
# full SIMD dispatch-table sweep happens out of the critical path.
on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
    paths:
      - 'src/c/**'
      - 'include/**'
      - 'ama_cryptography/**'
      - 'tests/c/test_dudect.c'
      - 'tests/c/dudect/**'
      - '.github/workflows/dudect.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/c/**'
      - 'include/**'
      - 'ama_cryptography/**'
      - 'tests/c/test_dudect.c'
      - 'tests/c/dudect/**'
  schedule:
    # Run weekly on Sundays at 02:00 UTC (existing schedule).
    - cron: '0 2 * * 0'
    # Nightly SIMD sweep at 03:30 UTC (audit Issue 3) — see
    # `dudect-simd-sweep` job below for the slot inventory.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      measurements:
        description: 'Number of measurements per test'
        required: false
        default: '100000'

permissions:
  contents: read

# Collapse overlapping runs on the same ref.  Main and the weekly +
# nightly schedules are preserved.
concurrency:
  group: dudect-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

jobs:
  dudect-utility:
    name: dudect - Utility Functions
    # The four legacy dudect lanes (utility / pqc / legacy-harnesses /
    # x25519-avx2-batch) only fire on:
    #   - push / pull_request (path-filtered above)
    #   - workflow_dispatch (operator-triggered)
    #   - the WEEKLY schedule '0 2 * * 0' (Sunday 02:00 UTC)
    # The new NIGHTLY schedule '30 3 * * *' (audit Issue 3) is for the
    # `dudect-simd-sweep` job only.  Without this guard, every nightly
    # run would also re-execute the four legacy lanes — wasted compute
    # the SIMD sweep doesn't need and explicit operational cost the
    # weekly schedule already covers.  Copilot review #322 follow-up.
    if: |
      github.event_name != 'schedule' ||
      github.event.schedule == '0 2 * * 0'
    runs-on: ubuntu-latest
    # 20, matching dudect-pqc: the measurement budget is now 600 s and
    # install + build takes 3-6 min on a hosted runner, so 15 left no
    # margin above the schedule the verdict rule can demand.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          .github/scripts/apt-install.sh build-essential cmake

      - name: Build with dudect enabled
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAMA_ENABLE_DUDECT=ON \
            -DAMA_USE_NATIVE_PQC=ON \
            -DAMA_ENABLE_LTO=OFF \
            -DAMA_BUILD_EXAMPLES=OFF
          cmake --build build -j$(nproc)

      - name: Run dudect tests (utility functions)
        env:
          MEASUREMENTS: ${{ github.event.inputs.measurements || '100000' }}
        run: |
          # Pin to single core; best-effort priority elevation.
          # GHA hosted runners lack CAP_SYS_NICE so `nice -n -10` would
          # print "Permission denied" but still exec the binary —
          # detect that once up front and drop the nice prefix so the
          # log stays clean.  The probe reads the RESULTING niceness:
          # GNU nice warns-and-continues on EPERM and exits with the
          # command's status, so the previous exit-status probe
          # (`if nice -n -10 true`) succeeded everywhere and never
          # dropped the dead prefix.  The harness setup-symmetry fixes
          # (v3.2.0) made the lanes noise-tolerant enough that
          # taskset-only pinning is the load-bearing CI gate.
          # The verdict rule decides whether this gate can block a merge, and
          # a measurement pass cannot exercise it: reproducing "the same lane
          # trips in every round" on demand would need a real leak. Drive it
          # with synthetic evidence first — deterministic, milliseconds — so a
          # broken rule fails loudly instead of silently passing everything.
          ./build/bin/test_dudect --self-test
          NICE_PREFIX=""
          if [ "$(nice -n -10 nice 2>/dev/null)" = "-10" ]; then NICE_PREFIX="nice -n -10"; fi
          # 600 s, not 300.  The verdict rule may demand up to MAX_ROUNDS
          # rounds (it refuses the early exit once any lane has tripped), and
          # a round of 100,000 measurements over 27 lanes takes about 100 s on
          # a hosted runner — so a 300 s budget could not cover the schedule
          # the rule can ask for.  It did not: a run that tripped one lane in
          # round 1 was cut short in round 3 and recorded NINE lanes as
          # harness faults, which is not a result anyone can act on.  This is
          # the same budget `dudect-pqc` below already uses for the same
          # binary at the same measurement count; the three jobs disagreeing
          # (300 / 600 / 900) was the defect.  The harness also refuses to
          # START a round the remaining budget cannot finish, so an
          # underestimate here degrades to "judged on fewer rounds, and says
          # so" rather than to a wall of faults.
          taskset -c 0 $NICE_PREFIX \
            ./build/bin/test_dudect --measurements "$MEASUREMENTS" --timeout 600

  dudect-pqc:
    name: dudect - PQC Primitives
    # Same legacy-lane schedule guard as dudect-utility — see that
    # job's header for rationale.
    if: |
      github.event_name != 'schedule' ||
      github.event.schedule == '0 2 * * 0'
    runs-on: ubuntu-latest
    # The weekly schedule run does a high-N reading (see the run step) and needs
    # more wall-clock than a PR run; 40 min covers build + the 30-min test cap.
    timeout-minutes: ${{ (github.event_name == 'schedule' && 40) || 20 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          .github/scripts/apt-install.sh build-essential cmake

      - name: Build with dudect and PQC enabled
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAMA_ENABLE_DUDECT=ON \
            -DAMA_USE_NATIVE_PQC=ON \
            -DAMA_AES_CONSTTIME=ON \
            -DAMA_ENABLE_LTO=OFF \
            -DAMA_BUILD_EXAMPLES=OFF
          cmake --build build -j$(nproc)

      - name: Run dudect tests (all functions incl. PQC)
        env:
          # workflow_dispatch input wins; the weekly schedule run uses a high-N
          # reading (a cleaner Welch t on the heavy PQC + secp256k1 ECDSA-sign
          # lanes than a noisy PR run affords); PR runs stay at 100k for speed.
          MEASUREMENTS: ${{ github.event.inputs.measurements || (github.event_name == 'schedule' && '500000') || '100000' }}
        run: |
          # Best-effort priority elevation — see `dudect-utility` for rationale.
          # The verdict rule decides whether this gate can block a merge, and
          # a measurement pass cannot exercise it: reproducing "the same lane
          # trips in every round" on demand would need a real leak. Drive it
          # with synthetic evidence first — deterministic, milliseconds — so a
          # broken rule fails loudly instead of silently passing everything.
          ./build/bin/test_dudect --self-test
          NICE_PREFIX=""
          if [ "$(nice -n -10 nice 2>/dev/null)" = "-10" ]; then NICE_PREFIX="nice -n -10"; fi
          # Give the high-N scheduled reading more wall-clock than a PR run.
          DUDECT_TIMEOUT=600
          if [ "${{ github.event_name }}" = "schedule" ]; then DUDECT_TIMEOUT=1800; fi
          taskset -c 0 $NICE_PREFIX \
            ./build/bin/test_dudect --measurements "$MEASUREMENTS" --timeout "$DUDECT_TIMEOUT"

  dudect-legacy-harnesses:
    name: dudect - Legacy Harnesses (tools/constant_time)
    # Same legacy-lane schedule guard as dudect-utility.
    if: |
      github.event_name != 'schedule' ||
      github.event.schedule == '0 2 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          .github/scripts/apt-install.sh build-essential cmake

      - name: Build C library
        # The harnesses below do NOT link this build — tools/constant_time's
        # own Makefile compiles the sources it needs at -O2.  The build type is
        # pinned anyway so the configuration is stated rather than inherited
        # from a default this project does not set.
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAMA_USE_NATIVE_PQC=ON -DAMA_ENABLE_LTO=OFF
          cmake --build build -j$(nproc)

      - name: Build and run legacy dudect harnesses
        run: |
          cd tools/constant_time
          make clean && make all
          # This job builds the standalone tools/constant_time harnesses; it
          # never builds build/bin/test_dudect, so the self-test is invoked on
          # the binaries that exist here. All three harnesses share the verdict
          # rule in tests/c/dudect/dudect_rounds.h, so this checks the same
          # code the CMake suite checks — from the build that actually runs it.
          ./dudect_harness --self-test
          ./dudect_crypto --self-test
          # Best-effort priority elevation — see `dudect-utility` for rationale.
          NICE_PREFIX=""
          if [ "$(nice -n -10 nice 2>/dev/null)" = "-10" ]; then NICE_PREFIX="nice -n -10"; fi
          echo "=== Utility function timing analysis ==="
          taskset -c 0 $NICE_PREFIX ./dudect_harness 50000
          echo "=== Crypto primitive timing analysis ==="
          taskset -c 0 $NICE_PREFIX ./dudect_crypto 50000

  dudect-x25519-avx2-batch:
    # Re-runs the dudect binary with AMA_DISPATCH_USE_X25519_AVX2=1 so
    # the `X25519 scalarmult batch×4` lane actually exercises the
    # 4-way AVX2 kernel rather than four sequential scalar ladders.
    # Without this opt-in, the batch lane measures the scalar path
    # (the dispatcher leaves x25519_x4 NULL by default — see
    # CHANGELOG [3.0.0] §Performance for the rationale) and the SIMD
    # kernel's constant-time signal is never sampled in CI.
    name: dudect - X25519 AVX2 4-way (opt-in)
    # Same legacy-lane schedule guard as dudect-utility.
    if: |
      github.event_name != 'schedule' ||
      github.event.schedule == '0 2 * * 0'
    runs-on: ubuntu-latest
    # 20, matching dudect-pqc: the measurement budget is now 600 s and
    # install + build takes 3-6 min on a hosted runner, so 15 left no
    # margin above the schedule the verdict rule can demand.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          .github/scripts/apt-install.sh build-essential cmake

      - name: Build with dudect enabled
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAMA_ENABLE_DUDECT=ON \
            -DAMA_USE_NATIVE_PQC=ON \
            -DAMA_ENABLE_LTO=OFF \
            -DAMA_BUILD_EXAMPLES=OFF
          cmake --build build -j$(nproc)

      - name: Run dudect with X25519 AVX2 4-way kernel wired in
        env:
          MEASUREMENTS: ${{ github.event.inputs.measurements || '100000' }}
          AMA_DISPATCH_USE_X25519_AVX2: '1'
        run: |
          # Best-effort priority elevation — see `dudect-utility` for rationale.
          # The verdict rule decides whether this gate can block a merge, and
          # a measurement pass cannot exercise it: reproducing "the same lane
          # trips in every round" on demand would need a real leak. Drive it
          # with synthetic evidence first — deterministic, milliseconds — so a
          # broken rule fails loudly instead of silently passing everything.
          ./build/bin/test_dudect --self-test
          NICE_PREFIX=""
          if [ "$(nice -n -10 nice 2>/dev/null)" = "-10" ]; then NICE_PREFIX="nice -n -10"; fi
          # Same budget as the other two full-suite jobs — see `dudect-utility`
          # for why 300 s could not cover MAX_ROUNDS rounds.
          taskset -c 0 $NICE_PREFIX \
            ./build/bin/test_dudect --measurements "$MEASUREMENTS" --timeout 600

  # ===========================================================================
  # SIMD sweep — nightly cron only (audit Issue 3 close-out)
  # ===========================================================================
  #
  # The four legacy jobs above sample the scalar / generic paths and a
  # single opt-in AVX2 X25519 lane.  This sweep is now PER-SLOT: each
  # matrix cell sets `AMA_DISPATCH_ONLY=<slot>` so the dispatcher
  # leaves every kernel pointer at its scalar fallback EXCEPT the
  # named one.  The resulting t-value is attributable to ONE SIMD
  # kernel rather than to whichever AVX2 paths happened to fire under
  # the same dispatch invocation.  See `apply_dispatch_only()` in
  # src/c/dispatch/ama_dispatch.c for the per-slot resolution and
  # `tests/c/test_dispatch_only_env.c` for the end-to-end contract
  # check that pins the env-var → active-slot mapping.
  #
  # Matrix:
  #
  #   os = ubuntu-latest     (x86-64 host)
  #        ubuntu-24.04-arm  (AArch64 / NEON / [SVE2 if available] host)
  #
  #   slot — the full dispatch-table-routable SIMD inventory.  The
  #   `exclude:` entries below remove cells that the runner's CPU
  #   architecture cannot satisfy (e.g., NEON / SVE2 / aes-gcm-neon
  #   on an x86-64 host; AVX-* slots on an ARM host).  Slots whose
  #   CPU feature is *not* present at runtime on a host that COULD
  #   theoretically satisfy them (e.g., ubuntu-24.04-arm without
  #   SVE2 silicon) self-skip via CTest exit 77 inside test_dudect.
  #
  # The sweep is scheduled-only (cron) to keep PR latency low.  The
  # legacy per-PR jobs above remain the gate for changed source code.
  # If a sweep lane FAILS its strict t-value threshold, the failure
  # is raised as a regular GitHub Actions failure on the schedule
  # run — the project owner reviews it and files a follow-up before
  # merging any new SIMD work.
  dudect-simd-sweep:
    name: dudect - SIMD sweep (${{ matrix.os }} / ${{ matrix.slot }})
    # Fires on:
    #   - the NIGHTLY schedule '30 3 * * *' (audit Issue 3)
    #   - workflow_dispatch (operator-triggered)
    # The WEEKLY '0 2 * * 0' schedule is reserved for the four legacy
    # lanes above; running the sweep on both weekly and nightly would
    # double-bill compute without adding coverage.
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '30 3 * * *') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        slot:
          - sha3-avx512x4
          - kyber-ntt-avx2
          - dilithium-ntt-avx2
          - chacha20-avx2x8
          - argon2-g-avx2
          - aes-gcm-neon
          - chacha20-neon
          - sha3-neon
          - kyber-sve2
          - sha3-sve2
          - x25519-avx2
        exclude:
          # x86-64 hosts (ubuntu-latest): exclude NEON + SVE2 slots.
          # The kernels are AArch64-only; the dispatcher will report
          # the slot unsupported and CTest will treat the cell as a
          # silent pass — wasting compute and producing a confusing
          # green run.  Skip them at the matrix level instead.
          - os: ubuntu-latest
            slot: aes-gcm-neon
          - os: ubuntu-latest
            slot: chacha20-neon
          - os: ubuntu-latest
            slot: sha3-neon
          - os: ubuntu-latest
            slot: kyber-sve2
          - os: ubuntu-latest
            slot: sha3-sve2
          # AArch64 hosts (ubuntu-24.04-arm): exclude AVX-* slots and
          # the AVX2 X25519 lane.  Same rationale as above, with
          # `aes-gcm-neon` / `chacha20-neon` / `sha3-neon` retained
          # on this side because AArch64 mandates NEON.  SVE2 slots
          # are KEPT on this side: the build step now passes
          # -DAMA_ENABLE_SVE2=ON, so a 77 (Skipped) here means the
          # RUNNER'S SILICON lacks SVE2 — a real audit trail — rather
          # than the kernels having been omitted from the build, which
          # is what it silently meant while that flag was missing.
          - os: ubuntu-24.04-arm
            slot: sha3-avx512x4
          - os: ubuntu-24.04-arm
            slot: kyber-ntt-avx2
          - os: ubuntu-24.04-arm
            slot: dilithium-ntt-avx2
          - os: ubuntu-24.04-arm
            slot: chacha20-avx2x8
          - os: ubuntu-24.04-arm
            slot: argon2-g-avx2
          - os: ubuntu-24.04-arm
            slot: x25519-avx2
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          .github/scripts/apt-install.sh build-essential cmake

      - name: Build with dudect + every SIMD path the host supports
        run: |
          # AMA_ENABLE_SIMD / NEON / AVX2 default ON in CMakeLists.txt;
          # we set them explicitly here to insulate the sweep from a
          # future change of those defaults.  AVX-512 is opt-in (see
          # CMakeLists.txt:64); enable it on x86-64 so the AVX-512
          # 4-way Keccak kernel is sampled when the runner exposes it.
          #
          # AMA_ENABLE_SVE2 is opt-in and defaults OFF, and omitting it here
          # made the two sve2 slots below unrunnable rather than unsupported:
          # with the kernels never compiled, the dispatcher reported the slot
          # missing and the cell exited 77 on EVERY run, on silicon that has
          # SVE2 and silicon that does not alike.  That is the failure this
          # workflow exists to prevent — an availability probe answering "not
          # applicable" in the same words it would use if it had passed — so
          # the sve2 kernels this repository ships had, and would have kept,
          # no timing coverage at all.  Enabling it is safe on x86-64: the
          # CMake block is guarded on CMAKE_SYSTEM_PROCESSOR (CMakeLists.txt
          # :506-507), so on a non-AArch64 host the flag is a no-op and those
          # slots are excluded from the matrix anyway.
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAMA_ENABLE_DUDECT=ON \
            -DAMA_BUILD_TESTS=ON \
            -DAMA_USE_NATIVE_PQC=ON \
            -DAMA_AES_CONSTTIME=ON \
            -DAMA_ENABLE_SIMD=ON \
            -DAMA_ENABLE_AVX2=ON \
            -DAMA_ENABLE_AVX512=ON \
            -DAMA_ENABLE_NEON=ON \
            -DAMA_ENABLE_SVE2=ON \
            -DAMA_ENABLE_LTO=OFF \
            -DAMA_BUILD_EXAMPLES=OFF
          cmake --build build -j$(nproc)

      - name: Confirm dispatch slot resolves on this host
        # Before burning a 15-minute dudect run, assert via the
        # per-slot contract test that AMA_DISPATCH_ONLY actually
        # honored the requested slot on this runner.  Exit code 77
        # from the contract binary means "Skipped" — propagate that
        # as a step output (`supported=false`) so the dudect step
        # below skips this matrix cell entirely.  Without the
        # supported-flag + downstream `if:`, a `exit 0` here would
        # NOT prevent the subsequent dudect lane from firing on a
        # scalar-fallback dispatch table — Copilot review #323
        # follow-up.
        id: confirm
        env:
          AMA_DISPATCH_ONLY: ${{ matrix.slot }}
          # x25519-avx2 requires the opt-in flag in addition to
          # AMA_DISPATCH_ONLY (see dispatch_init_internal()
          # rationale in src/c/dispatch/ama_dispatch.c — the AVX2
          # 4-way ladder is opt-in by default because the scalar fe64
          # path beats it on Skylake-Cascade-class cores).  Setting
          # the flag here for every cell is a no-op for the others.
          AMA_DISPATCH_USE_X25519_AVX2: '1'
          # Pin off the auto-tune microbench so a noisy runner can't
          # demote the requested SIMD slot back to generic and turn
          # the dudect measurement into a scalar-baseline run.
          AMA_DISPATCH_NO_AUTOTUNE: '1'
        run: |
          set -e
          if [ -x ./build/bin/test_dispatch_only_env ]; then
            TEST_BIN=./build/bin/test_dispatch_only_env
          else
            TEST_BIN=./build/tests/c/test_dispatch_only_env
          fi
          rc=0
          "$TEST_BIN" || rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Slot '${{ matrix.slot }}' unsupported on this host — skipping dudect lane."
            exit 0
          elif [ "$rc" -ne 0 ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::error::Dispatch contract test failed for '${{ matrix.slot }}' (exit=$rc)"
            exit "$rc"
          fi
          echo "supported=true" >> "$GITHUB_OUTPUT"

      - name: Run dudect with AMA_DISPATCH_ONLY=${{ matrix.slot }}
        # Skip this lane entirely when the confirmation step above
        # reported the slot as unsupported — measuring a scalar
        # fallback under the per-slot label would produce a
        # misleading t-value attributed to a kernel that didn't run.
        if: steps.confirm.outputs.supported == 'true'
        env:
          MEASUREMENTS: ${{ github.event.inputs.measurements || '100000' }}
          AMA_DISPATCH_ONLY: ${{ matrix.slot }}
          AMA_DISPATCH_USE_X25519_AVX2: '1'
          AMA_DISPATCH_NO_AUTOTUNE: '1'
        run: |
          # Best-effort priority elevation — see `dudect-utility` for rationale.
          # The verdict rule decides whether this gate can block a merge, and
          # a measurement pass cannot exercise it: reproducing "the same lane
          # trips in every round" on demand would need a real leak. Drive it
          # with synthetic evidence first — deterministic, milliseconds — so a
          # broken rule fails loudly instead of silently passing everything.
          ./build/bin/test_dudect --self-test
          NICE_PREFIX=""
          if [ "$(nice -n -10 nice 2>/dev/null)" = "-10" ]; then NICE_PREFIX="nice -n -10"; fi
          taskset -c 0 $NICE_PREFIX \
            ./build/bin/test_dudect --measurements "$MEASUREMENTS" --timeout 900

  ghash-scalar-invariance:
    # The scalar AES-GCM path is not measured by any lane above.  The
    # `dudect-legacy-harnesses` AES-GCM lane varies the key — which varies the
    # GHASH subkey H, exactly the right stimulus — but it calls the public
    # entry point, and every x86-64 runner has PCLMULQDQ/VAES, so the
    # dispatcher routes it to the SIMD kernel and the scalar GHASH is never
    # executed.  Same blind spot the `dudect-x25519-avx2-batch` job exists to
    # close, in the opposite direction: there the SIMD kernel went unsampled,
    # here the fallback does.
    #
    # It runs on every trigger, unlike the schedule-scoped lanes above,
    # because it is deterministic rather than statistical: callgrind counts
    # retired instructions, so there is no significance threshold to reach and
    # no quiet machine to wait for.  A few minutes on each PR buys a verdict
    # that does not depend on runner load.
    name: Scalar AES-GCM instruction-count invariance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          .github/scripts/apt-install.sh build-essential cmake valgrind

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Build the AMA_TESTING_MODE static library
        # Release is load-bearing, not tidiness.  Every target in
        # check_ghash_constant_time.py looks for a transformation the OPTIMIZER
        # performs — a mask it can prove is 0 or ~0, turned back into a branch
        # on the secret predicate (src/c/internal/ama_ct_barrier.h).  This
        # project sets no default CMAKE_BUILD_TYPE, so the configure line that
        # stood here produced C_FLAGS with no -O flag at all, and the gate
        # measured a program in which its own defect class cannot occur.  It
        # passed for that reason: re-run at -O3, `--target ecdsa` measured a
        # 9,424-instruction key-dependent spread in the secp256k1 scalar
        # arithmetic under clang 18, a live Montgomery extra-reduction leak.
        # The tool now refuses an unoptimized library rather than trusting this
        # line to be right (ama_build_optimization_probe).
        #
        # LTO off: the check reads instruction counts out of this archive, and
        # link-time optimisation would let the driver's call site reshape the
        # very code under measurement.
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAMA_USE_NATIVE_PQC=ON \
            -DAMA_BUILD_TESTS=ON -DAMA_ENABLE_LTO=OFF
          cmake --build build -j"$(nproc)" --target ama_cryptography_test

      - name: Scalar AES-GCM instruction count must not depend on the key
        run: |
          python tools/check_ghash_constant_time.py \
            --lib build/lib/libama_cryptography_test.a --target ghash

      - name: ama_consttime_memcmp instruction count must not depend on the data
        # The dudect lane for this same function is a wall-clock statistical
        # test and it flakes on shared runners -- it failed at |t| = 5.21
        # against a 4.5 threshold in 2 of 3 rounds on a commit that did not
        # touch src/c/ama_consttime.c, whose instruction count is invariant by
        # construction (measured byte-identical across all eight classes).
        # This is the deterministic counterpart: it cannot flake, so it is what
        # a real early-exit regression trips. The dudect lane stays as the
        # wall-clock cross-check.
        run: |
          python tools/check_ghash_constant_time.py \
            --lib build/lib/libama_cryptography_test.a --target consttime

      - name: Ascon-Hash256 instruction count must not depend on the input
        # Same deterministic counterpart, for the same reason and with a
        # sharper case behind it.  The wall-clock lane reported |t| = 19.0 in
        # 5 of 5 rounds, consistently signed, on a shared runner — while the
        # SAME binary is a null elsewhere (t = +2.16 / -1.57 / -1.18 at
        # 50,000 / 200,000 / 800,000 iterations: no sqrt(n) growth, sign
        # flipping).  The lane's construction is already symmetric, so the
        # disagreement was between two machines rather than two harnesses.
        #
        # Measured here: 20,167,057 retired instructions for all eight input
        # classes, cross-class delta 0, noise floor 0.  ama_ascon_hash256 is
        # therefore input-independent, and the wall-clock difference belongs
        # to the CPU's data-operand-dependent execution — what Intel's DOITM
        # and ARM's PSTATE.DIT exist to control — not to src/c/ama_ascon.c.
        # This gate is what a real regression in that file trips; the dudect
        # lane stays as the wall-clock cross-check.
        run: |
          python tools/check_ghash_constant_time.py \
            --lib build/lib/libama_cryptography_test.a --target ascon-hash

      - name: SHA3-256 instruction count must not depend on the input
        # Same question as the Ascon-Hash256 gate above, raised by the same
        # kind of evidence.  The `Constant-Time Verification (Smoke Test)`
        # lane in ci.yml reported SHA3-256 at t = +12.05 in 3 of 5 rounds,
        # consistently signed, on commit 09b2e51 — and t = +2.42 (0/1) on
        # its parent 2b2dc9d, which differs by no C code at all: that commit
        # changed Python and documentation only.  The harness escalates past
        # round 1 only when a lane trips, so the two runs are the same binary
        # measured twice on the same runner class.
        #
        # The lane's construction is not the suspect either: it builds both
        # inputs before the loop and selects between them with a branchless
        # pointer select outside the timer.  That lane USED to have exactly
        # the defect one would suspect, and it is documented as fixed in
        # tools/constant_time/dudect_crypto.c.
        #
        # Measured here: SHA3-256 costs 10,055 retired instructions per call
        # and that cost does not depend on the input.  The whole-process
        # figure this gate prints is dominated by a ~1.736e9 one-time
        # dispatch initialisation (dispatch_init_internal plus the
        # Dilithium/Kyber NTT reference-vs-AVX2 equivalence self-checks) that
        # the first SHA3 call triggers; that initialisation is
        # class-independent but not bit-reproducible, and it is the entire
        # source of the small cross-class spread this gate tolerates.  It was
        # separated out by differencing iteration counts and by re-running a
        # single class: identical input, five runs, spread 17 instructions.
        # A zero-hash control over all eight classes is exactly constant.
        #
        # So ama_sha3_256 is input-independent and the wall-clock reading
        # belongs to the CPU's data-operand-dependent execution (DOITM /
        # PSTATE.DIT), not to src/c/ama_sha3.c.  This gate is what a real
        # regression in that file trips.
        run: |
          python tools/check_ghash_constant_time.py \
            --lib build/lib/libama_cryptography_test.a --target sha3-256

      - name: Ed25519 signing instruction count must not depend on the key
        # The same CI run flagged Ed25519 sign at t = -6.71 in 4 of 5 rounds,
        # consistently signed, having passed at -2.40 on the parent commit.
        # This is the most serious of the three lanes, because unlike a hash
        # the class variable here IS the long-term secret: a real
        # input-dependence would be a key-recovery surface rather than a
        # nuisance, so it gets the deterministic instrument rather than an
        # argument from the wall clock.
        #
        # Measured here: 33,949,265 retired instructions for all eight
        # secret-key classes — cross-class delta 0, noise floor 0.  Signing
        # is deterministic per RFC 8032 §5.1.6, so for the fixed message this
        # driver uses the count is a pure function of the key; that function
        # is constant.  ama_ed25519_sign is key-independent, and this gate is
        # what a conditional point-add or a data-dependent window index in
        # the comb would trip.
        run: |
          python tools/check_ghash_constant_time.py \
            --lib build/lib/libama_cryptography_test.a --target ed25519-sign

      - name: Ascon-AEAD128 encryption instruction count must not depend on the key
        # The wall-clock lane `Ascon-AEAD128 encrypt (key-independent)` in
        # tests/c/test_dudect.c crosses the threshold on shared runners with a
        # per-class difference around +0.6 ns — under a quarter of the 2 ns
        # effect-size floor — and the SAME binary at the SAME measurement count
        # read 3/3 consistently signed (+0.596 ns) on one runner and 2+/1- on
        # another (+0.607 ns).  A quantity whose sign is not reproducible
        # between two machines executing identical instructions is not a
        # property of the code.
        #
        # dudect declines to adjudicate that range on the stated grounds that
        # these deterministic gates own it.  For Ascon ENCRYPT that was not
        # true: `ascon-hash` covers Ascon-Hash256 and `aead-verify` covers the
        # AEAD accept/reject pair, and neither covers this call — the exemption
        # rested on coverage that did not exist.  This is that coverage.
        #
        # Measured here: 32,069,814 retired instructions, byte-identical across
        # all eight key classes — cross-class delta 0, noise floor 0.
        run: |
          python tools/check_ghash_constant_time.py \
            --lib build/lib/libama_cryptography_test.a --target ascon-encrypt

      - name: Agent binding check instruction count must not depend on the verdict
        # Same gap, same remedy, for the other lane observed reaching the
        # sub-floor range: `agent binding check (verdict-independent)` read
        # |t| = 41.72 in 3 of 3 rounds at -1.141 ns on a shared runner.
        #
        # Here the two classes are not two secrets but two VERDICTS — an
        # authorization that verifies against one whose first byte is flipped.
        # A verdict oracle is the leak that matters for this call: if rejecting
        # costs less than accepting, an attacker learns whether a forged
        # authorization was close.  That is the same defect `aead-verify` pins
        # for the ciphers.
        #
        # Measured here: 612,810,230 retired instructions, byte-identical
        # whether the check accepts or rejects — delta 0, noise floor 0.
        run: |
          python tools/check_ghash_constant_time.py \
            --lib build/lib/libama_cryptography_test.a --target agent-binding

      - name: ML-KEM decapsulation instruction count must not depend on the FO verdict
        # A decapsulator measurably faster on implicit rejection hands an
        # attacker the plaintext-checking oracle the Fujisaki-Okamoto transform
        # exists to deny — the IND-CCA2 argument for the whole scheme.
        #
        # The wall-clock lane `Kyber-1024 decaps (CT reject)` read |t| = 11.81
        # in 3 of 3 rounds at +5.630 ns on a shared runner: ABOVE the 2 ns
        # effect-size floor and in mispredicted-branch range, so it failed the
        # build and needed a deterministic answer rather than an excuse.
        #
        # Over 60 decapsulations per class on the Release (-O3) library this
        # job now builds, retired instructions, data references and both
        # cache-miss counts are byte-identical between the valid and the
        # rejected ciphertext, under gcc 13 and clang 18 alike — the deltas
        # are the invariant; the absolute figures move with the build and are
        # recorded in CHANGELOG.md against the commit that produced them.
        # Instructions rule out a branch or skipped work; the data-reference
        # and miss figures rule out a secret-dependent access, which an
        # instruction count alone cannot see. The dudect wall-clock lane is
        # INFO for that reason and THIS is what blocks.
        #
        # The excursion that prompted this target has since been traced to the
        # lane rather than to ML-KEM: it selected its ciphertext with a
        # class-correlated ternary in front of the timer, and on a null
        # experiment (byte-identical ciphertexts, true effect zero, 200,000
        # measurements x 5 runs) that construction reads over threshold in 3
        # of 5 runs, worst |t| = 6.99, all one sign. The lane now stages both
        # classes under a mask and is 0 of 5. This target's verdict does not
        # depend on that history — it never did — but the reason it was added
        # was a measurement the harness produced on its own.
        run: |
          python tools/check_ghash_constant_time.py \
            --lib build/lib/libama_cryptography_test.a --target kyber-decaps

      - name: NIST P-256 ECDSA instruction count must not depend on the key
        # The `ecdsa` step below measures src/c/ama_secp256k1.c. The NIST
        # P-curves are a separate implementation with their own limb
        # arithmetic, and nothing measured it — which is how clang 18 at -O3
        # came to be making `nistp_mont_mul` key-dependent by 1,251 retired
        # instructions over four signatures, branching on the Montgomery
        # extra-reduction predicate. P-256, P-384 and P-521 share that
        # arithmetic, so this covers the family's scalar core.
        run: |
          python tools/check_ghash_constant_time.py \
            --lib build/lib/libama_cryptography_test.a --target nistp-ecdsa

      - name: X25519 instruction count must not depend on the scalar
        # The Montgomery ladder's conditional swap is predicated on one bit of
        # the secret scalar per step. The dudect lane for X25519 is wall-clock
        # on a shared runner; this is its deterministic counterpart, the same
        # pairing `ecdsa` has with the `secp256k1 ECDSA sign` lane.
        run: |
          python tools/check_ghash_constant_time.py \
            --lib build/lib/libama_cryptography_test.a --target x25519

      - name: Batched X25519 instruction count must not depend on the scalars
        # `ama_x25519_scalarmult_batch` is a separate entry point from
        # `ama_x25519_key_exchange`, with its own four-lane chunker, scalar
        # tail, and an aggregated low-order rejection that must zero EVERY
        # output when ANY lane rejects.  The step above reaches none of it.
        #
        # Its dudect lane (`X25519 scalarmult batch x4`) is info-only, and
        # info-only is defensible exactly where a deterministic gate blocks
        # instead — the pairing `Kyber-1024 decaps` and `secp256k1 ECDSA sign`
        # both cite.  This lane had no such counterpart, so nothing could fail
        # on a batch-path regression.
        #
        # Both wirings are measured, because which one runs is an environment
        # choice: the second run opts the AVX2 4-way kernel in, and that kernel
        # had never been measured by a deterministic instrument at all.
        run: |
          python tools/check_ghash_constant_time.py \
            --lib build/lib/libama_cryptography_test.a --target x25519-batch
          AMA_DISPATCH_USE_X25519_AVX2=1 \
            python tools/check_ghash_constant_time.py \
              --lib build/lib/libama_cryptography_test.a --target x25519-batch

      - name: secp256k1 ECDSA instruction count must not depend on the key
        # Catches a branch on a secret in the scalar field arithmetic — the
        # Montgomery extra-reduction leak (Walter & Thompson, CT-RSA 2001).
        # No dudect lane covers this: `dudect - Legacy Harnesses` measures
        # ECDSA sign but classifies it INFO because RFC 6979 candidate
        # rejection is legitimately variable-time, so a real leak underneath
        # it does not fail anything.
        run: |
          python tools/check_ghash_constant_time.py \
            --lib build/lib/libama_cryptography_test.a --target ecdsa

      - name: Build the shared object this branch actually ships
        # The steps above measure the AMA_TESTING_MODE static archive, which is
        # the right subject for callgrind but not for the check below: the
        # KyberSlash question is about the instructions the SHIPPED object
        # contains, and LTO across the real link is exactly where a division
        # would or would not survive.
        run: |
          cmake -B build-shared -DCMAKE_BUILD_TYPE=Release \
            -DAMA_USE_NATIVE_PQC=ON -DAMA_BUILD_TESTS=OFF -DAMA_BUILD_EXAMPLES=OFF
          cmake --build build-shared -j"$(nproc)" --target ama_cryptography_shared

      - name: No divide instruction may take a secret operand (KyberSlash)
        # ML-KEM's Compress_d written as a division by q, lowered by the
        # compiler to a `div` with operand-dependent latency over a
        # secret-derived numerator.  This repository shipped that once; the fix
        # was the Granlund-Montgomery reciprocal in src/c/ama_kyber.c, and
        # nothing existed that would notice the fix being undone.  Reading the
        # C does not settle it — the source says `/`, and only the object says
        # whether a divide was emitted.
        #
        # Verified against the real defect rather than a mock: with the
        # reciprocal replaced by `n / q_div` and the library rebuilt, this gate
        # reported 32 new divide instructions (kyber_decapsulate_internal 8,
        # poly_compress 24) and exited 1.  The mutation was reverted.
        run: |
          python tools/check_secret_division.py \
            --lib build-shared/lib/libama_cryptography.so

  aead-verify-invariance:
    # The AEAD accept/reject pair at ct_len == 0, pinned by retired
    # instruction counts.  Runs on the ARM runner deliberately: the
    # defect this gate exists to catch was aarch64-specific — gcc 13
    # compiled the ChaCha20-Poly1305 decrypt's ternary return into a
    # cbnz whose reject arm was one instruction longer, which the
    # chacha20-neon dudect sweep slot measured statistically at
    # |t| = 8.08 (3/3 rounds, reject-slower) while the same source
    # compiled branch-free on x86-64.  QEMU instruction traces of the
    # accept/reject pair localized the divergence to that single
    # branch; the masked return in ama_chacha20poly1305.c /
    # ama_aes_gcm.c removes it, and this job holds both decrypts
    # there, deterministically, on the architecture where the
    # regression manifests.  Same callgrind methodology as
    # ghash-scalar-invariance above — no statistics, no quiet-machine
    # requirement — and unconditional on every trigger for the same
    # reason.
    name: AEAD verify instruction-count invariance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          .github/scripts/apt-install.sh build-essential cmake valgrind

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Build the AMA_TESTING_MODE static library
        # LTO off for the same reason as ghash-scalar-invariance: the
        # check reads instruction counts out of this archive.
        run: |
          # Release for the reason recorded on the x86 job above: an
          # unoptimized library cannot exhibit the codegen this gate exists to
          # catch, and the aarch64 defect it was built for — gcc 13 compiling a
          # ternary return into a cbnz with unequal arms — is an -O decision.
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAMA_USE_NATIVE_PQC=ON \
            -DAMA_BUILD_TESTS=ON -DAMA_ENABLE_LTO=OFF
          cmake --build build -j"$(nproc)" --target ama_cryptography_test

      - name: AEAD accept/reject instruction counts must be equal
        run: |
          python tools/check_ghash_constant_time.py \
            --lib build/lib/libama_cryptography_test.a --target aead-verify

  dudect-gate:
    name: Constant-Time Gate
    # Single aggregating status check for this workflow, matching the
    # `ci-gate` pattern in ci.yml. Branch protection should require ONLY this
    # context instead of the individual job names, so adding or renaming a job
    # updates this needs: list under code review rather than drifting the
    # branch-protection config out of sync.
    #
    # if: always() so the gate resolves to a definitive red/green even when a
    # dependency fails, rather than reporting `skipped` and leaving the PR
    # stuck "waiting for status".
    if: always()
    needs:
      - dudect-utility
      - dudect-pqc
      - dudect-legacy-harnesses
      - dudect-x25519-avx2-batch
      - dudect-simd-sweep
      - ghash-scalar-invariance
      - aead-verify-invariance
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - name: Fail unless every job reached the state this trigger requires
      # A gate that simply demands `success` from all five jobs would be red
      # on every pull request, because all five carry schedule-scoping `if:`
      # conditions and `dudect-simd-sweep` is skipped on PRs BY DESIGN. A gate
      # that tolerates `skipped` unconditionally has the opposite problem: a
      # job that silently stopped running would report green.
      #
      # So this gate does neither. It re-derives each job's own trigger
      # condition and asserts the job reached the state that condition
      # implies:
      #
      #   should run  -> result MUST be `success`  (a skip here is a silent gap)
      #   should skip -> result MUST be `skipped`  (a run here is condition drift)
      #
      # That is strictly stronger than both alternatives: `skipped` can never
      # report green for a job that was supposed to execute, and the gate also
      # catches a job whose `if:` was loosened without review.
      #
      # The conditions below MUST mirror the `if:` on each job above. They are
      # duplicated because GitHub Actions offers no way to reference another
      # job's condition; the duplication is the cost of checking it at all.
      env:
        EVENT:    ${{ github.event_name }}
        SCHEDULE: ${{ github.event.schedule }}
        R_UTILITY: ${{ needs.dudect-utility.result }}
        R_PQC:     ${{ needs.dudect-pqc.result }}
        R_LEGACY:  ${{ needs.dudect-legacy-harnesses.result }}
        R_X25519:  ${{ needs.dudect-x25519-avx2-batch.result }}
        R_SWEEP:   ${{ needs.dudect-simd-sweep.result }}
        R_GHASH:   ${{ needs['ghash-scalar-invariance'].result }}
        R_AEADVER: ${{ needs['aead-verify-invariance'].result }}
      run: |
        set -euo pipefail
        rc=0

        # The four legacy lanes: everything except a non-weekly schedule.
        if [ "${EVENT}" != "schedule" ] || [ "${SCHEDULE}" = "0 2 * * 0" ]; then
          legacy_expected="success"
        else
          legacy_expected="skipped"
        fi

        # The SIMD sweep: the nightly schedule, or an operator dispatch.
        if { [ "${EVENT}" = "schedule" ] && [ "${SCHEDULE}" = "30 3 * * *" ]; } \
           || [ "${EVENT}" = "workflow_dispatch" ]; then
          sweep_expected="success"
        else
          sweep_expected="skipped"
        fi

        check() {
          job="$1"; actual="$2"; expected="$3"
          if [ "${actual}" = "${expected}" ]; then
            echo "  OK    ${job}: ${actual} (expected ${expected})"
            return 0
          fi
          if [ "${expected}" = "success" ] && [ "${actual}" = "skipped" ]; then
            echo "::error::${job} was SKIPPED but this trigger requires it to run."
          elif [ "${expected}" = "skipped" ]; then
            echo "::error::${job} ran (${actual}) but this trigger should skip it — its \`if:\` condition drifted."
          else
            echo "::error::${job} did not succeed: ${actual}"
          fi
          rc=1
        }

        echo "event=${EVENT} schedule='${SCHEDULE}'"
        echo "expected: legacy lanes=${legacy_expected}, simd sweep=${sweep_expected}"
        check dudect-utility            "${R_UTILITY}" "${legacy_expected}"
        check dudect-pqc                "${R_PQC}"     "${legacy_expected}"
        check dudect-legacy-harnesses   "${R_LEGACY}"  "${legacy_expected}"
        check dudect-x25519-avx2-batch  "${R_X25519}"  "${legacy_expected}"
        check dudect-simd-sweep         "${R_SWEEP}"   "${sweep_expected}"
        # Unconditional job: it carries no `if:`, so the only acceptable
        # result on every trigger is success.
        check ghash-scalar-invariance   "${R_GHASH}"   "success"
        check aead-verify-invariance    "${R_AEADVER}" "success"

        if [ "${rc}" -ne 0 ]; then
          echo "::error::Constant-Time Gate failed."
          exit 1
        fi
        echo "Constant-Time Gate passed — every job reached the state this trigger requires."
