version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "Steel-SecAdv-LLC"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    # Version update strategy
    versioning-strategy: increase
    # Allow only security updates and compatible version updates
    allow:
      - dependency-type: "all"
    # No ignore rules.  A semver-major ignore on `cryptography` stood here;
    # it kept that package's floor at 46.0.7 while four advisories fixed
    # only in majors 48-50 accumulated against it (see pyproject.toml
    # [legacy]).  `cryptography` is a test/benchmark-only extra
    # (INVARIANT-1), and CI resolves its newest release on every run, so a
    # major bump is exercised before it merges.
    # Batch routine version bumps into ONE PR per scheduled run so CI is
    # invoked once for the whole set instead of once per dependency. This
    # replaces the recurring manual-consolidation chore (see PRs #320, #334,
    # #341). `applies-to: version-updates` is explicit so SECURITY updates are
    # NOT batched — Dependabot still opens those as individual, immediate PRs,
    # preserving fast CVE response (INVARIANT-14 hygiene is unaffected).
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"

  # Enable security updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "Steel-SecAdv-LLC"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    # Same rationale as the pip group above: one grouped PR per weekly run
    # keeps CI invocations down. Security updates remain ungrouped/immediate.
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
