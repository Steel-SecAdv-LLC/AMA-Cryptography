name: "AMA Cryptography CodeQL"

# CodeQL settings for the static-analysis CodeQL Security Analysis job.
# Wired up via `config-file:` on github/codeql-action/init.
#
# Every C source in the tree is first-party (the vendored Ed25519 backend
# and its shim were removed in the twenty-first maintenance pass; see
# CHANGELOG), so nothing is excluded from analysis and no rule is disabled
# for third-party noise.  `cpp/include-non-header` stays active so an
# accidental `#include "foo.c"` pattern surfaces; the generated table header
# src/c/internal/ama_ed25519_tables.h is a header and is included as one.
#
# Policy for a future vendor-cosmetic finding: there is no vendored tree to
# blame it on, so it is a first-party finding — resolve it at the source,
# never with a Security-UI dismissal, and never by adding a paths-ignore.
