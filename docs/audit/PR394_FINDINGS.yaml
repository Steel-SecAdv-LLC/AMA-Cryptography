- id: FINDING-0001
  severity: MAJOR
  title: "The MSan and TSan lanes cannot complete on the current head: test_secure_free_scrub walks the sanitizer shadow through /proc/self/mem"
  discovered_by: "tool (lane replication: build-msan ctest hung 1256 s; build-tsan ctest hung; CI run 33587115953 cancelled both jobs at their caps)"
  evidence_before:
    - "docs/audit/logs/findings/0001-before-msan-ctest.log"
    - "docs/audit/logs/findings/0001-before-tsan-ctest.log"
    - "GitHub run 33587115953 (workflow_dispatch of static-analysis.yml at 2cd50cb): jobs 100113472876 (MSan) and 100113473036 (TSan) conclusion=cancelled after 24 and 19 minutes; job 100118093319 Static Analysis Gate conclusion=failure"
  failing_command: "timeout 600 ./build-msan/bin/test_secure_free_scrub"
  failing_exit_code: 124
  parent_sha: "ef0fcc8b0a8c1a8ed84a1d5cd7ab0cf3ed3a7c53"
  fix_sha: "e7ddd98"
  passing_command: "./build-msan/bin/test_secure_free_scrub && ./build-tsan/bin/test_secure_free_scrub"
  passing_exit_code: 0
  permanent_test: "tests/c/test_secure_free_scrub.c (ctest: test_secure_free_scrub, run by the MSan and TSan lanes of static-analysis.yml); docs/audit/logs/findings/0001-after2-build-msan-positive.log, 0001-after2-build-tsan-positive.log"
  regression_risk: "The scan now reads only mincore-resident pages; a sentinel copy in a swapped-out page would be missed. CI runners have no swap; the negative mode (FINDING-0002) proves detection on every lane."
  rubric_note: "Not BLOCKER: no security property is compromised and no published claim names the current head's sanitizer result; the PR description's 67/67 MSan/TSan figures are scoped to 7432e0d, before the test existed. MAJOR because a property (sanitizer-clean C suite) was unverified on the current head and the lanes that verify it could not finish."
  status: closed

