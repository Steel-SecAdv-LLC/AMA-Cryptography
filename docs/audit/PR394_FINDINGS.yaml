- id: FINDING-0003
  severity: MAJOR
  title: "tools/check_keygen_pct.py (INVARIANT-41) blesses a keygen whose family dispatch lost one arm's pairwise test: AmaContext.keypair_generate would release untested ML-DSA, SLH-DSA and hybrid keypairs with the gate green"
  discovered_by: "negative control NC-17 (docs/audit/negative_controls.py): the signature arm of _keypair_pairwise_test replaced by a no-op; the gate still exited 0 because the helper still called pairwise_test_kem in its other arm and so still counted as 'reaching a helper'"
  evidence_before:
    - "docs/audit/logs/findings/0003-before-keygen-pct.log (ledger FIND-0003-before: HEAD's gate against the mutated module, exit 0)"
    - "docs/audit/ledger.tsv rows NC-17-v (first run: exit 0) and NC-17-c"
  failing_command: "python <HEAD:tools/check_keygen_pct.py> --root <tree whose ama_cryptography/pqc_backends.py has the signature arm of _keypair_pairwise_test replaced by (lambda *a, **k: None)(...)>"
  failing_exit_code: 0
  parent_sha: "e7ddd98"
  fix_sha: "(this audit commit) tools/check_keygen_pct.py: arms_without_pct() — every arm of an if/else or match in which a sibling arm runs a pairwise test must run one too or raise; a helper with a dark arm is not a delegating helper; the arm is named in the diagnostic"
  passing_command: "python tools/check_keygen_pct.py --root <same mutated tree>  (exit 1, names pqc_backends.py:3426 _keypair_pairwise_test [conditional arm]); python tools/check_keygen_pct.py (clean tree, exit 0)"
  passing_exit_code: 1
  permanent_test: "tests/test_keygen_pct_gate.py::TestConditionalArms (six cases: delegated helper with a dark arm, entry point with a dark arm, raising arm accepted, match cases, earlier conditionals do not end the scan, CLI names the arm) and ::TestTheRealTree::test_a_missing_backend_fails_closed; docs/audit/logs/findings/0003-after-keygen-pct.log; docs/audit/logs/phaseD/NC-17-violated.log (exit 1) and NC-17-clean.log (exit 0)"
  regression_risk: "The rule judges explicit arms only; an `if` with no `else` whose fall-through path releases the keypair untested is still not seen (stated in the gate's docstring and pinned by test_an_if_without_else_opens_no_comparison). Mutation round 1 of the gate (docs/audit/logs/phaseD/mutation/check_keygen_pct.round1.tsv): 47/55 killed; two survivors were real test gaps (the arm scan stopping early; the missing-backend path returning None) and are now pinned."
