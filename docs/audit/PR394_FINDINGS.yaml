    - "docs/audit/logs/phaseF/acvp-run.log (per-algorithm Tested/Skipped/MCT-other columns; 12 files fetched; 6,608 tcIds counted in them)"
    - "docs/compliance/ACVP_SELF_ATTESTATION.md '5,789 vectors were skipped total' (4,667 AFT-filtered + 1,122 non-AFT) — the accounting existed, one link away from the headline"
  failing_command: "python -m pytest tests/test_acvp_claim_calibration.py -q --no-cov  (against the previous README sentence)"
  failing_exit_code: 1
  parent_sha: "e7ddd98"
  fix_sha: "(this audit commit) README.md: the sentence now says the 1,215 is the in-scope subset and carries the 5,789 / 4,667 / 1,122 accounting with its named skip classes"
  passing_command: "python -m pytest tests/test_acvp_claim_calibration.py -q --no-cov"
  passing_exit_code: 0
  permanent_test: "tests/test_acvp_claim_calibration.py (README totals equal the attestation's; the attestation's buckets add up)"
