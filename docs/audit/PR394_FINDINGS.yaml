- id: FINDING-0008
  severity: MINOR
  title: "Every fuzz configure in fuzzing.yml built at -O0 to protect a frame pointer that was never at risk, costing 3.0x to 16.7x fuzzing depth per target"
  discovered_by: "Phase D fuzz-depth measurement (docs/audit/sweeps/fuzz_depth.sh): every libFuzzer target run for 60 s with the workflow's own recipe (seed corpus, dictionary, -max_len from check_fuzz_input_reachability.py) at CI's Debug build, then at -O2 -g"
  evidence_before:
    - "docs/audit/PR394_FUZZ_DEPTH.tsv (CI's Debug build): fuzz_sphincs 20 executions in 60 s, fuzz_frost 515, fuzz_dilithium 1,748, fuzz_argon2 1,961"
    - "docs/audit/PR394_FUZZ_DEPTH_O2G.tsv (-O2 -g, NDEBUG stripped, same corpora and limits): 116, 5,627, 7,167, 8,775 — 3.0x (fuzz_hkdf) to 16.7x (fuzz_ed25519) across the fifteen targets"
    - "docs/audit/PR394_FUZZ_DEPTH_RWDI.tsv (RelWithDebInfo, i.e. -O2 -g -DNDEBUG): the same speedup, recorded to separate the optimisation effect from the assert() effect"
    - "the workflow's stated reason, in fuzzing.yml: 'Release would append -fomit-frame-pointer after them and cost the stack traces a crash report is for'"
  failing_command: "cmake -B build-fuzz-rel -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release -DAMA_BUILD_FUZZ=ON ... && grep '^C_FLAGS' build-fuzz-rel/fuzz/CMakeFiles/fuzz_kyber.dir/flags.make"
  failing_exit_code: 0
  parent_sha: "e7ddd98"
  fix_sha: "(this audit commit) .github/workflows/fuzzing.yml: all four fuzz configures at -DCMAKE_BUILD_TYPE=RelWithDebInfo with -DCMAKE_C_FLAGS_RELWITHDEBINFO='-O2 -g' (NDEBUG stripped so assert() stays live exactly as under Debug), and the comment replaced by the measurement"
  passing_command: "grep -oE '\\-f(no-)?omit-frame-pointer|\\-DNDEBUG|\\-O[0-3]' build-fuzz-o2g/fuzz/CMakeFiles/fuzz_kyber.dir/flags.make"
  passing_exit_code: 0
  permanent_test: "The emitted flags are the proof and are quoted in the workflow comment: a Release fuzz configure's flags.make reads '... -fomit-frame-pointer -fno-omit-frame-pointer', the target's own FUZZ_FLAGS last, so the frame pointer survives at every build type; the new configure reads '-O2 -g' with no -DNDEBUG. tools/check_workflow_commands.py passes on the edited file."
  regression_risk: "Optimised code gives coarser line attribution inside an ASan report than -O0, though the frame pointer (and therefore the stack) is unchanged. Nothing else differs: same sanitizers, same asserts, same corpora, same -max_len. If a future crash report is hard to read, the remedy is -O1, not -O0."
  rubric_note: "MINOR: no security property was compromised and the fuzz lanes were green; what was lost is coverage per unit of CI time, on the four targets that most need it (sphincs at 20 executions per run was fuzzing its seed corpus and nothing else). It is a finding because the branch's stated reason for the choice is checkable and false."
  status: closed

- id: FINDING-0009
  severity: MAJOR
  title: "The claims ledger reported 1,364 confirmed reproductions when 864 of them were a grep: 70% of the ledger never ran its subject, and 638 claims typed `behavioural` were confirmed by finding a string"
  discovered_by: "auditor, re-reading the ledger's own reproduction column after the repository owner asked what in this audit is misleading"
  evidence_before:
    - "docs/audit/PR394_CLAIMS.yaml at 990a248: 1,815 claims, verdicts 1364 confirmed : 139 refuted : 312 unverifiable, published in PR394_ATTESTATION.md as '1815 executed reproductions'"
    - "classification of the reproduction column at that head: 1,279 of 1,815 commands are grep/sed/awk/git/ls (text at rest), 122 are `historical:<sha>` and were never run, 53 are cross-references to another table in this audit, and 355 execute anything at all"
    - "cross-tabulated by claim kind: 677 of the 923 claims typed `behavioural` had a text-inspection reproduction, of which 638 were marked confirmed"
  failing_command: "python docs/audit/classify_claims.py --report   (against the ledger as committed at 990a248)"
  failing_exit_code: 0
  parent_sha: "990a248"
  fix_sha: "(this audit commit) docs/audit/classify_claims.py: every claim carries `method` (executed / artefact-probe / text-inspection / not-executed) and `strength` (reproduced / text-present / not-established); a behavioural or numeric claim confirmed by text inspection alone is re-typed `text-only`; provenance and negative claims keep `confirmed` under text inspection because reading the bytes IS the claim; `refuted` is never re-typed"
  passing_command: "python docs/audit/classify_claims.py --report && python docs/audit/attest_tallies.py"
  passing_exit_code: 0
  permanent_test: "tests/test_claims_classifier.py — 35 cases: what counts as running the subject, the two over-crediting bugs found by sampling (a program named inside a grep pattern; a `python -c` that only reads files), the kind-aware re-typing rule in both directions, and a ledger-wide invariant that no behavioural or numeric claim is confirmed by text alone"
  regression_risk: "The classifier reads shell text and can only be as good as its rule; two errors were found by sampling and each is now a test. It errs toward `text-inspection`, the conservative direction: a mistake there understates the audit rather than flattering it. Claims whose reproduction genuinely runs the subject through an unusual entry point may be under-credited."
  rubric_note: "MAJOR: no shipped code is affected and no gate was involved, but the audit's own headline figure — the number a reader of the attestation trusts most — overstated its evidence by a factor of 2.7 (500 reproduced against 1,364 claimed). Not BLOCKER because the underlying observations are all retained and each claim's reproduction command was always printed beside its verdict, so the record was checkable; it was the summary that was not."
  status: closed

