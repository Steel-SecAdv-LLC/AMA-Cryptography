    - "docs/audit/logs/phaseD/r3-efficacy.log and docs/audit/PR394_3R_EFFICACY.tsv: point anomalies at 10x median flagged 30% (baseline 80%) at FPR 1.4% (baseline 1.8%); at 1.5x, 5% (baseline 26%); bursts of 20 at 3x: 41% (baseline 15%); +10% step detected after 19 samples (baseline 47); +5% step after 182 (baseline 47)"
  failing_command: "python docs/audit/sweeps/r3_efficacy.py --samples 4000 --repeats 5 --out docs/audit/PR394_3R_EFFICACY.tsv  (the measurement; the 'failure' is the README stating a detector without its measured rate)"
  failing_exit_code: 0
  parent_sha: "e7ddd98"
  fix_sha: "(this audit commit) README.md: the 3R note now carries the measured rates and tells the reader to treat the timing monitor as a regime-change detector, not a per-operation one; tests/test_3r_efficacy_calibration.py pins the prose to the table"
  passing_command: "python -m pytest tests/test_3r_efficacy_calibration.py -q --no-cov"
  passing_exit_code: 0
  permanent_test: "tests/test_3r_efficacy_calibration.py (3 tests: point rates, step delays, the table is a real measurement with 26 rows and its benign-trace header)"
  regression_risk: "The measurement is one trace on one host under load (Valgrind and fuzz sweeps were running); the absolute rates will move on other hosts, and the test pins the README to whatever the committed table says, not to a floor. The detector's code is unchanged: this finding is closed by calibrating the claim, and the §10 adjudication records the argument for why the subsystem still ships (advisory, never blocking, and better than the baseline on regime shifts of 10% or more)."
  rubric_note: "MAJOR under §10's own rule: the branch stated the absence of efficacy evidence and stopped there; honesty had substituted for the measurement. Not BLOCKER: no security property depends on the monitor (it never blocks, and README already disclaimed timing-attack detection)."
