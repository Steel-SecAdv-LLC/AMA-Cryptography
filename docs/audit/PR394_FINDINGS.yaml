- id: FINDING-0004
  severity: MINOR
  title: "tools/check_workflow_commands.py: check_expression_syntax() never looked at bare `if:` conditions and had no rule for a lone `=`; a job condition that would make the whole workflow file fail to parse passed the gate"
  discovered_by: "negative control NC-29b (docs/audit/negative_controls.py): ci.yml's first job-level `if: ... == ...` rewritten with a single `=`; the gate reported WORKFLOW COMMAND CHECK PASSED"
  evidence_before:
    - "docs/audit/logs/findings/0004-before-workflow-expr.log (ledger FIND-0004-before: HEAD's gate against the mutated workflow copy, exit 0)"
    - "docs/audit/ledger.tsv rows NC-29b-v (first run: exit 0) and NC-29b-c"
  failing_command: "python <HEAD:tools/check_workflow_commands.py> --workflows-dir <copy of .github/workflows whose ci.yml line 71 reads `if: steps.setup-python.outcome = 'failure'`>"
  failing_exit_code: 0
  parent_sha: "e7ddd98"
  fix_sha: "(this audit commit) tools/check_workflow_commands.py: _iter_expression_bodies() yields the value of every `if:` key as an expression body alongside each `${{ }}` body, and _ASSIGNMENT_OPERATOR_RE rejects a `=` that is not part of `==`, `!=`, `<=`, `>=` (string literals blanked first, as for arithmetic)"
  passing_command: "python tools/check_workflow_commands.py --workflows-dir <same mutated copy>  (exit 1); python tools/check_workflow_commands.py (clean tree: 84 runner labels ... 289 expressions, exit 0)"
  passing_exit_code: 1
  permanent_test: "tests/test_workflow_command_checks.py::TestExpressionSyntax::test_a_lone_equals_and_a_bare_if_are_rejected (4 shapes) and ::test_legitimate_bare_conditions_are_not_flagged (6 shapes, each counted); docs/audit/logs/findings/0004-after-workflow-expr.log; docs/audit/logs/phaseD/NC-29b-*.log and NC-29c-*.log (bare `if:` with arithmetic)"
  regression_risk: "Every bare `if:` in the tree is now scanned (64 more expressions than before); a legitimate condition containing a lone `=` outside a string literal does not exist in GitHub's grammar, so no false positive class is introduced. The check still does not reimplement the grammar: an unknown function name or a stray `)` remains uncaught."
  rubric_note: "MINOR: no security property depends on it, and the failure mode (a workflow file that GitHub refuses to parse) is loud on the next push rather than silent. It is a finding at all because the gate's own docstring names 'expression forms GitHub's parser rejects' as its scope and a negative control inside that scope could not make it fail."
  status: closed

