  passing_command: "python docs/audit/negative_controls.py --only NC-48,NC-49,NC-50"
  passing_exit_code: 0
  permanent_test: "tests/test_fuzz_input_reachability_gate.py, tests/test_ed25519_backend_parity_gate.py, tests/test_ghash_constant_time_gate.py; controls retained at docs/audit/logs/phaseD/NC-4{8,9}-*.log and NC-50-*.log, ledger rows NC-48-v/-c, NC-49-v/-c, NC-50-v/-c"
