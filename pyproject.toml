[build-system]
# Build-time dependencies (PEP 518).  These versions are floors enforced
# by setup.py's preflight check (D-9).
#
# - setuptools >= 83.0.0 (D-8/D-9): older releases — particularly Debian's
#   patched 68.x — fail bdist_wheel with `AttributeError: install_layout`.
#   70.0.0 closes GHSA-cx63-2mw6-8hw5 and 78.1.1 closes PYSEC-2025-49; the
#   floor is pinned at 83.0.0 (the latest baseline) and setup.py's preflight
#   check enforces the SAME value so the isolated-build requirement and the
#   guard cannot drift.
# - wheel >= 0.47.0 (D-8): closes GHSA-8rrh-rw8j-w5fx.
# - cmake: required to auto-build the native C cryptographic library during
#   `pip install .` — the CMakeBuild command in setup.py invokes cmake.
# - numpy, Cython: required to build the math_engine extension; failures
#   here are now FATAL unless AMA_NO_CYTHON=1 (D-4).  Users on pure-Python
#   environments are still supported via the opt-out env var.
requires = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
    "cmake>=4.4.0",
    "Cython>=3.2.8",
    "numpy>=1.24.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "ama-cryptography"
version = "5.0.0"
description = "Quantum-resistant cryptographic protection system for helical mathematical Omni-Codes"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Andrew E. A.", email = "steel.sa.llc@gmail.com"}
]
maintainers = [
    {name = "Steel Security Advisors LLC", email = "steel.sa.llc@gmail.com"}
]
keywords = [
    "cryptography",
    "quantum-resistant",
    "post-quantum-cryptography",
    "dilithium",
    "ml-dsa",
    "kyber",
    "ml-kem",
    "sphincs",
    "ed25519",
    "aes-gcm",
    "sha3",
    "hmac",
    "pqc",
    "security",
    "integrity-protection",
    "digital-signatures"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
math = [
    # NumPy/Cython for the optional math_engine Cython extension.
    # Not required for core cryptographic operations.
    # Install with: pip install "ama-cryptography[math]"
    "numpy>=1.24.0,<3.0.0",
    "Cython>=3.2.8",
]
monitoring = [
    # NumPy/SciPy for mathematical monitoring (equations, double_helix_engine)
    # Install with: pip install "ama-cryptography[monitoring]"
    # scipy floor is 1.11.0 to match the [dev] extra and requirements-dev.txt:
    # scipy < 1.11 has no wheels for this project's Python 3.10+ floor.
    "numpy>=1.24.0,<3.0.0",
    "scipy>=1.11.0",
]
legacy = [
    # PyCA cryptography is NOT a runtime fallback — INVARIANT-1 prohibits a
    # PyCA dependency in the production code path, and the runtime tree
    # imports nothing from this package.  This extra exists solely so that
    # downstream tests and benchmark scripts (tests/test_aes_gcm_native.py,
    # tests/test_hkdf_sha3_256.py, tests/test_ed25519_native.py, and
    # benchmarks/comparative_benchmark.py) which cross-check our native
    # primitives against an independent reference implementation can be
    # installed with one extra:
    #   pip install "ama-cryptography[legacy]"
    #
    # Production deployments do NOT need this extra; do not install it
    # unless you are reproducing the native-vs-pyca cross-checks.
    #
    # Floor is 46.0.7 to clear the open CVEs against earlier majors:
    #   GHSA-h4gh-qq45-vh27 / CVE-2024-26130   — fixed in 42.0.4
    #   CVE-2024-0727 (PKCS12 OOB read)        — fixed in 42.0.2
    #   CVE-2023-50782 (Bleichenbacher timing) — fixed in 42.0.0
    #   CVE-2026-26007                          — fixed in 46.0.5
    #   CVE-2026-34073                          — fixed in 46.0.6
    # Manual bump because dependabot.yml carries a `version-update:
    # semver-major` ignore on this package; security fixes that span
    # majors (41 → 46) cannot land via the bot.  Re-evaluate the ignore
    # rule when the next major ships if a CVE follows.
    "cryptography>=46.0.7",
]
hsm = [
    # PKCS#11 support for hardware security modules.
    #
    # Build note for platforms without a PyKCS11 wheel (Linux, ARM, macOS
    # arm64, Windows cp314): every PyKCS11 sdist regenerates its wrapper
    # with the host SWIG, and its interface file names the Python 2
    # `PyInt_FromLong` in a %typemap.  SWIG >= 4.3 removed the compatibility
    # alias that made that compile, so the sdist build fails under a current
    # SWIG regardless of the version pinned here.  Until upstream removes
    # the Python 2 call, install with the alias restored at the compiler
    # command line, exactly as CI does (see .github/workflows/ci.yml):
    #   CPPFLAGS="-DPyInt_FromLong=PyLong_FromLong" pip install "PyKCS11>=1.5.18"
    # (MSVC: set CL=/DPyInt_FromLong=PyLong_FromLong instead.)
    "PyKCS11>=1.5.18",
]
benchmark = [
    # Peer cryptographic libraries for benchmarks/comparative_benchmark.py.
    # These are BENCHMARK-ONLY comparison targets — not production
    # dependencies. INVARIANT-1 ("zero external crypto dependencies")
    # applies to the production library; this extra exists purely so that
    # `pip install ama-cryptography[benchmark]` brings in the peer
    # implementations needed to reproduce the numbers in
    # benchmark-report.md.  Mirrors benchmarks/requirements-bench.txt.
    # Install with: pip install "ama-cryptography[benchmark]"
    "pynacl>=1.6.2",
    # Same 46.0.7 floor as [legacy] above — closes CVE-2026-26007 /
    # -34073 that 42.x still has open. Mirrors the bump in
    # benchmarks/requirements-bench.txt.
    "cryptography>=46.0.7",
]
docs = [
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-autodoc-typehints>=3.0.1",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "pytest-xdist>=3.0.0",
    "hypothesis>=6.161.8",
    # Black 26.5.1 carries the GHSA-fc3w-v5rg-v7q6 fix and requires Python
    # 3.10+ — consistent with this project's requires-python >= 3.10 floor,
    # so no version guard is needed.
    "black>=26.5.1",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    # setup.py is inside `mypy --strict` (see ci.yml::code-quality), and
    # setuptools ships no `py.typed`.  Without these stubs the type-check job
    # FAILS — measured, 5 errors in setup.py: `Library stubs not installed for
    # "setuptools.command.build_ext"`, the same for `setuptools.dist`, and
    # `Class cannot subclass "Distribution"/"build_ext" (has type "Any")`.
    # (This comment used to say the base class "is Any and every override on
    # CMakeBuild goes unchecked while the run still reports success".  There is
    # no silent-Any outcome to have: reaching it would need an
    # `ignore_missing_imports` override for setuptools, and the override list
    # below does not contain one.)
    "types-setuptools>=84.0.0.20260812",
    # PyYAML is imported directly by thirteen modules under tests/ and tools/
    # (the workflow, gate-coverage, secret-scan and severity-gate checkers all
    # parse YAML structurally rather than by regex).  It arrived only as a
    # transitive dependency of bandit, so `pip install -e ".[dev]"` produced an
    # environment whose imports happened to work.  types-PyYAML is the same
    # case as types-setuptools above: `mypy --strict` ships in this extra and
    # the CI type-check step runs it over those same modules, so without the
    # stubs the declared developer environment cannot reproduce the gate --
    # measured as 13 `Library stubs not installed for "yaml"` errors in every
    # test job.  requirements-dev.txt already declared both; this extra was the
    # outlier.
    "PyYAML>=6.0.3",
    "types-PyYAML>=6.0.12.20260724",
    "bandit>=1.7.0",
    # `safety` was removed in v3.2.0: it was a dev-deps inventory entry
    # that NO CI workflow ever invoked.  Vulnerability scanning is
    # already covered by `pip-audit` (run with `--strict --requirement
    # requirements-lock.txt` in both .github/workflows/ci-build-test.yml
    # ::security and .github/workflows/security.yml::security-audit), so
    # `safety` was pure transitive surface area.  Its dep closure
    # (`nltk` + `joblib` in particular) carried two known CVEs with no
    # upstream fix versions — joblib PYSEC-2024-277 (disputed
    # NumpyArrayWrapper deserialization, only used during caching of
    # trusted content) and nltk PYSEC-2026-97 (filestring() file-read,
    # unreachable from AMA which never imports nltk).  Removing
    # `safety` deletes the chain entirely rather than annotating an
    # ignore-list — INVARIANT-14 hygiene + INVARIANT-1 zero-runtime-dep
    # posture both improve.
    "Cython>=3.2.8",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]
# Umbrella extra — aggregates the non-overlapping extras above via PEP 508
# self-reference so a single `pip install ama-cryptography[all]` pulls in
# the full developer / benchmark / docs / math stack.
all = [
    "ama-cryptography[math]",
    "ama-cryptography[monitoring]",
    "ama-cryptography[legacy]",
    "ama-cryptography[hsm]",
    "ama-cryptography[benchmark]",
    "ama-cryptography[docs]",
    "ama-cryptography[dev]",
]

[project.urls]
Homepage = "https://github.com/Steel-SecAdv-LLC/AMA-Cryptography"
Documentation = "https://github.com/Steel-SecAdv-LLC/AMA-Cryptography/blob/main/README.md"
Repository = "https://github.com/Steel-SecAdv-LLC/AMA-Cryptography"
Issues = "https://github.com/Steel-SecAdv-LLC/AMA-Cryptography/issues"

[tool.setuptools.package-data]
ama_cryptography = [
    "_integrity_digest.txt",
    # Pinned NIST ACVP-Server vectors used by FIPS 140-3 POST.
    # Verify-only KATs keep module-import latency under the 2000ms budget
    # while still exercising the full FIPS 205 SHAKE-128s code path.
    "_post_kats/*.json",
]

# Ruff configuration — replaces flake8, isort
[tool.ruff]
# target-version tracks the runtime SUPPORT floor (Python 3.10 — see
# requires-python / classifiers / CI matrix), so ruff evaluates every lint
# against the exact minimum the package supports.  The project intentionally
# keeps explicit Optional[...] / Union[...] / List / Dict typing; that style is
# preserved by ignoring the pyupgrade PEP 604 / PEP 585 rewrites (UP006, UP007,
# UP035, UP045) below rather than by holding target-version one release lower.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe complexity (replaces flake8 --max-complexity)
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]
# Do not add ignores without a comment explaining why.
ignore = [
    # PEP 604 / PEP 585 pyupgrade rewrites. This project intentionally keeps
    # explicit Optional[...] / Union[...] / List / Dict typing (see the
    # [tool.ruff] note above). UP006/UP015 stay scoped to ama_cryptography/*
    # below; UP007 (Union -> X | Y), UP045 (Optional -> X | None) and UP035
    # (deprecated typing imports) fire codebase-wide once target-version is
    # py310, so they are ignored globally to preserve that deliberate style
    # everywhere rather than triggering ~200 mechanical annotation rewrites.
    "UP007",
    "UP035",
    "UP045",
    # B905: zip(..., strict=...) only became expressible at Python 3.10, so
    # this bugbear rule activates with the target-version bump. The existing
    # zip() call sites are length-matched by construction; leaving them
    # non-strict keeps the bump behaviour-neutral (no new runtime exceptions)
    # instead of mechanically editing 40+ call sites during a version bump.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# assert is valid in pytest tests; hardcoded passwords are test fixtures;
# subprocess calls are tested intentionally; Unicode in test docstrings is fine;
# uppercase vars used for crypto constants in test data;
# E722: bare except required to catch pyo3_runtime.PanicException (BaseException subclass)
"tests/*" = [
    "S101", "S105", "S106", "S603", "S607",
    "RUF001", "RUF002", "RUF003",
    "N801", "N806",
    "E722",
]
# test_fuzzing.py: E402 is architecturally required — Hypothesis settings profiles
# must be registered and loaded BEFORE importing the test subjects, or the @given
# decorator picks up the wrong profile.  Moving these imports to the top of the
# file would break profile selection in CI vs local development.
"tests/test_fuzzing.py" = ["E402"]
# ama_cryptography/ uses intentional patterns that must not be changed:
#   N803/N806: uppercase variable names for crypto constants (e.g. R, S, A, K)
#   RUF001/RUF002/RUF003: Unicode symbols in docstrings/comments (σ, ✓, etc.)
#   S101: assert used in internal validation
#   S106/S107: hardcoded defaults for optional password parameters
#   E501: long lines in crypto constant definitions
#   B028: no-explicit-stacklevel in warnings (existing pattern)
#   RUF012: mutable class defaults (dataclass pattern)
#   N818: exception naming convention (existing names)
#   UP015: redundant open modes (existing pattern)
#   RUF010: explicit f-string type conversion (existing pattern)
#   RUF022: unsorted __all__ (existing order is logical, not alphabetical)
#   RUF100: unused noqa directives (will be cleaned separately)
# SECURITY: S110 (bare except:pass) and B904 (raise-without-from) are NOT
# suppressed — crypto code must propagate exceptions with full context.
"ama_cryptography/*" = [
    "N803", "N806", "N818",
    "RUF001", "RUF002", "RUF003", "RUF010", "RUF012", "RUF022", "RUF100",
    "S101", "S106", "S107",
    "E402", "E501",
    "B028",
    "UP006", "UP015", "UP035",  # UP006/UP035: deprecated typing imports (existing pattern)
]
# _build_sign.py intentionally keeps explicit Optional[...] annotations in the
# release-signing bootstrap for readability; UP045 would rewrite them to PEP 604
# `X | None` unions.  A deliberate style retention, not a compatibility guard.
"ama_cryptography/_build_sign.py" = ["UP045"]
# ama_cryptography/legacy_compat.py — ported from code_guardian_secure.py
#   UP007/UP045: PEP 604 union syntax (existing pattern)
#   S310/S603: URL open and subprocess calls in security tooling
#   UP012: unnecessary UTF-8 encoding argument
"ama_cryptography/legacy_compat.py" = [
    "N803", "N806", "N818",
    "RUF001", "RUF002", "RUF003", "RUF010", "RUF012", "RUF022", "RUF100",
    "S101", "S106", "S107",
    "E402", "E501",
    "B028",
    "S310", "S603",
    "UP006", "UP007", "UP012", "UP015", "UP035", "UP045",
]
"ama_cryptography/monitoring.py" = [
    "I001", "N806",
    "RUF003", "RUF022", "RUF023",
    "UP006", "UP015", "UP035",
]
# Demo script for the monitoring module
"tools/monitoring/ama_cryptography_monitor_demo.py" = ["B007", "RUF001"]
# Benchmark and tooling scripts — not part of the core library
# benchmarks/benchmark_suite.py: E402 because psutil optional-import block precedes ama_cryptography imports
"benchmarks/benchmark_suite.py" = ["C901", "UP006", "UP035", "E501", "E402"]  # C901: generate_markdown complexity
"setup.py" = ["E501", "RUF005", "S603", "S607"]
# benchmarks/* — chart generation and bench-harness scripts:
#   C901: matplotlib chart builders unavoidably exceed McCabe complexity (many panels, axes, annotations).
#   RUF001: chart captions and axis labels use the Unicode multiplication sign (×) and Greek letters intentionally.
#   E402/E501/F541/I001/RUF059/RUF100/UP006/UP035: same legacy-formatting / typing-imports patterns the
#         rest of the codebase carries (see "ama_cryptography/*" header above).
#   S603/S607: subprocess calls with bare executable name (git, cmake, ...) are intentional in benchmark tooling.
"benchmarks/*" = [
    "C901",
    "E402", "E501", "F541", "I001",
    "RUF001", "RUF059", "RUF100",
    "S603", "S607",
    "UP006", "UP035",
]
# examples/**  (double-star) is required — scripts live in examples/python/
"examples/**" = [
    "B007", "B904",
    "E402",
    "RUF001", "RUF059", "RUF100",
    "S106",
    "UP006", "UP035",
]
"tools/*" = [
    "B007", "B904",
    "C408", "C901",
    "E501",
    "I001",
    "RUF059",
    "S603", "S607",
]

# mccabe complexity threshold (replaces flake8 --max-complexity=15)
[tool.ruff.lint.mccabe]
max-complexity = 15

# Black configuration
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
skip-string-normalization = false

# MyPy configuration — strict mode
[tool.mypy]
# Static-analysis target = the project's minimum supported runtime.  The
# project dropped Python 3.9 (requires-python >= 3.10; see the classifiers and
# CI matrix), so 3.10 is now both the runtime floor and the type-analysis
# floor.  This also satisfies mypy >= 2.0 (2.3.0 via the python-dependencies
# group), which refuses python_version="3.9".
python_version = "3.10"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

# Per-module overrides for third-party stubs that do not exist.
[[tool.mypy.overrides]]
module = [
    "hypothesis.*",
    "scipy.*",
    "numpy.*",
    "pytest_benchmark.*",
    "pytest.*",
    "pytest",
    "_pytest.*",
    "rfc3161ng.*",
    "nacl.*",
    "Crypto.*",
    "PyKCS11.*",
    "cryptography.*",
    # Build-time optional imports in setup.py.  Listed here rather than
    # suppressed at the import site: an inline `# type: ignore` is an ERROR
    # under warn_unused_ignores on a machine where the package IS installed,
    # so the verdict would depend on the environment rather than on the code.
    "cmake",
    "packaging.*",
    # Cython.Build — setup.py imports it behind CYTHON_AVAILABLE, and the
    # type-check image has no reason to carry a compiler toolchain.
    "Cython.*",
    # Frameworks the integration EXAMPLES import.  They are not dependencies
    # of this library and are absent from every CI image; the examples are
    # inside `mypy --strict` so their calls into ama_cryptography are checked
    # (that is how four `create_crypto_package(dna_codes=...)` calls, a
    # parameter the function has never had, were found), not so the frameworks
    # themselves are.
    "flask",
    "flask.*",
    "fastapi",
    "fastapi.*",
    "pydantic",
    "pydantic.*",
    "uvicorn",
    "uvicorn.*",
    # atheris — the libFuzzer driver, importable only under a fuzzing build.
    "atheris",
    "atheris.*",
]
ignore_missing_imports = true


# Cython extension modules — no .py source or PEP 561 stubs.
[[tool.mypy.overrides]]
module = [
    "ama_cryptography.hmac_binding",
    "ama_cryptography.math_engine",
]
ignore_missing_imports = true

# Chart/report generators under benchmarks/ and tools/ import matplotlib and
# psutil.  Neither ships type information and neither is a runtime dependency
# of the library — they are dev-only, imported behind availability guards, and
# absent from the CI type-check image.  Listed here for the same reason as the
# block above: a missing third-party stub is not a typing defect in this tree.
[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "matplotlib",
    "psutil",
    "psutil.*",
]
ignore_missing_imports = true

# ama_cryptography_monitor — compatibility shim for production monitoring.
# ama_cryptography.monitoring — production monitoring, relax generic-type-arg.
# NOTE: ama_cryptography.* is NOT blanket-relaxed. Only specific modules that
# have pre-existing bare generic annotations (dict, list, tuple without type
# params) are individually listed here. New modules must use strict generics.
[[tool.mypy.overrides]]
module = [
    "ama_cryptography_monitor",
    "ama_cryptography.monitoring",
    "ama_cryptography.pqc_backends",
    "ama_cryptography.crypto_api",
    "ama_cryptography.adaptive_posture",
]
disallow_any_generics = false

# examples/ — the two web-framework integrations. FastAPI/Flask/pydantic have
# no stubs in any CI image (they are not dependencies of this library), so
# their base classes and route decorators are Any. Two strict flags fire on
# that alone and cannot be answered from this tree: subclassing an Any base,
# and a decorator that erases the type of what it wraps. Relaxed HERE rather
# than with inline ignores, and only these two flags — everything else stays
# on, which is what caught four `create_crypto_package(dna_codes=...)` calls
# naming a parameter the function has never had.
#
# Both spellings of each module: mypy derives the name from how it was
# invoked, so `mypy examples/` sees `fastapi_integration` while the CI run
# (`--explicit-package-bases`, needed so `schemas/` resolves the same way
# `tests/` imports it) sees `examples.python.fastapi_integration`. An override
# that matches only one spelling silently stops applying under the other.
[[tool.mypy.overrides]]
module = [
    "fastapi_integration",
    "flask_integration",
    "examples.python.fastapi_integration",
    "examples.python.flask_integration",
]
disallow_subclassing_any = false
disallow_untyped_decorators = false

# tests/ — pytest decorators (@pytest.fixture, @pytest.mark.*) are untyped;
# relax decorator and call strictness for test modules.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "tests.test_crypto_api"
disable_error_code = ["abstract"]

[[tool.mypy.overrides]]
module = "tests.test_crypto_import_paths"
disable_error_code = ["override"]

[[tool.mypy.overrides]]
module = "tests.test_key_management_comprehensive"
disable_error_code = ["attr-defined"]

# test_hkdf_sha3_256 uses a try/except pattern for optional cryptography imports.
# When cryptography IS installed (CI), the type: ignore comments are unused;
# when it is NOT installed (local dev), mypy needs them.  Suppress the clash.
[[tool.mypy.overrides]]
module = "tests.test_hkdf_sha3_256"
warn_unused_ignores = false

# Pytest configuration (consolidated from pytest.ini)
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --strict-config --showlocals --tb=short"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "quantum: marks tests that require quantum-resistant libraries",
    "integration: marks integration tests",
    "fips: marks FIPS 140-3 self-test and compliance tests",
    "smoke: marks smoke tests that verify no exception is raised",
    "requires_host_isa(token): the test's subject is an instruction-set extension; on a host without it the CI backend-skip escalation in tests/conftest.py leaves the skip alone (tokens: x86, x86-64, aarch64)",
    "requires_interop_oracle: the test cross-checks an AMA primitive against an external reference implementation (PyCA cryptography / PyNaCl / pycryptodome); under AMA_CI_REQUIRE_BACKENDS the require-backends lane installs those, so a skip means the oracle install broke and tests/conftest.py escalates it to a failure (audit M18)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # Allow native-backend-unavailable warnings during import (expected in CI
    # when the C library is not built).
    "default:.*native.*backend.*not available:UserWarning",
    # NOTE: the SecurityWarning filter is registered programmatically in
    # tests/conftest.py via pytest_configure(). Registering it here would
    # import ``ama_cryptography.exceptions`` during pytest's initial
    # conftest loading — before coverage starts — artificially dropping
    # exceptions.py coverage to 0%.
]

# Coverage configuration
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
# Coverage floor: fail the build if package coverage regresses below this.
# A conservative catastrophic-regression catch, NOT an aspirational target.
# Measured on the full ubuntu-latest suite: ~87% package coverage, and it holds
# at ~87% with OR without the Linux-only differential/interop lane (that lane
# adds assertions, not much unique line coverage).  The floor is set to 75 — a
# ~12-point margin below the measurement — because the --cov gate runs on every
# OS × Python cell (ci-build-test.yml) and the windows-latest / macos-latest
# cells cannot be measured here: they exercise different platform paths
# (VirtualLock vs POSIX mlock in secure_memory, etc.) and skip the Linux-gated
# differential libraries, so their totals drift a few points from Linux.
# Ratcheted up from the previous blind 60 now that the real figure is measured;
# raise it further toward the measured value in a dedicated commit rather than
# letting coverage silently drift down.
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    # NOTE: raise NotImplementedError is NOT excluded — unimplemented code
    # (e.g. secure_mlock, secure_munlock) must show as a coverage gap so
    # it's visible, not hidden.
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
