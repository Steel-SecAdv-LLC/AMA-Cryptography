#
# ClusterFuzzLite project metadata (google/clusterfuzzlite).  The build
# integration itself is oss-fuzz/: .clusterfuzzlite/build.sh execs
# oss-fuzz/build.sh, so the fuzzers ClusterFuzzLite runs nightly are built by
# the same script an OSS-Fuzz submission would use.
language: c
sanitizers:
  - address
  - undefined
  - memory
