# pyproject.toml is the single authoritative source for project metadata
# (name, version, dependencies, optional-dependencies) and tool configuration.
# Keeping that metadata duplicated here is a documented drift source
# (audit 2c/2d) — see setup.py's ``packages=...`` block and PR #256 review
# threads r3122679434 / r3122679492. This file carries no settings; it exists
# to document that none belong here.

# Lint configuration: ruff (authoritative) lives in pyproject.toml
# [tool.ruff]. The supplementary flake8 agreement check reinstated by #407
# is configured in .flake8 — the one lint setting with no pyproject home —
# because flake8 does not read pyproject.toml. No tool takes a setting from
# this file, but it is not unread: setuptools and mypy both look here, so
# tools/check_type_check_scope.py scans it (MYPY_CONFIG_FILES) to keep a
# [mypy] section from narrowing the type-check scope unseen.
